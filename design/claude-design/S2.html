<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta name="design_doc_mode" content="canvas">
  <title>S2 · Attente — Project Game Show</title>
  <link rel="stylesheet" href="tokens.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23332114'/%3E%3Cg stroke='%23f59a3c' stroke-width='2.6' stroke-linecap='round' fill='none'%3E%3Cpath d='M16 4.5c4 4.9 6 8.1 6 10.6a6 6 0 01-12 0c0-2.2 1.2-4.5 3.4-6.9'/%3E%3Cpath d='M4.6 25.2l22.8-4.6'/%3E%3Cpath d='M4.6 20.6l22.8 4.6'/%3E%3C/g%3E%3Ccircle cx='16' cy='17' r='2' fill='%23f59a3c'/%3E%3C/svg%3E">
</helmet>

<div style="background:var(--c-canvas-2);min-height:100vh;padding:var(--sp-8);display:flex;flex-direction:column;gap:var(--sp-8)">

  <header style="max-width:900px;display:flex;flex-direction:column;gap:var(--sp-3)">
    <p style="margin:0;font:400 var(--fs-200)/1 var(--f-mono);color:var(--c-ember-bright)">Surface stream · écran S2 · canvas 1920 × 1080</p>
    <h1 style="margin:0;font:600 var(--fs-900)/var(--lh-tight) var(--f-display);letter-spacing:var(--tr-display);text-transform:uppercase">Attente</h1>
    <p style="margin:0;font:400 var(--fs-400)/var(--lh-body) var(--f-ui);color:var(--c-ink-2);text-wrap:pretty">Capsule d'état en haut (même pièce que le « Connecté » du joueur, agrandie), accroche en display condensée, compteur de joueurs dans une carte à filet clair. Le panneau S1 reste à droite, inchangé.</p>
  </header>

  <!-- ══════ 1 · JOUEURS PRÉSENTS ══════ -->
  <figure style="margin:0;display:flex;flex-direction:column;gap:var(--sp-3)">
    <figcaption style="font:400 var(--fs-200)/1 var(--f-mono);color:var(--c-ink-3)">1 · des joueurs sont là · <span style="color:var(--c-ember-bright)">data-state="waiting"</span></figcaption>
    <div data-state="waiting" data-screen-label="S2 attente" style="width:var(--stream-w);height:var(--stream-h);border-radius:var(--r-l);background:var(--c-canvas);box-shadow:var(--sh-3),var(--sh-edge);overflow:hidden;position:relative;display:flex">
      <div style="position:absolute;inset:0;background:var(--g-hearth);pointer-events:none"></div>

      <div style="position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--gap-st);padding:var(--pad-st)">
        <div style="display:flex;align-items:center;gap:var(--sp-4);align-self:flex-start;padding:var(--sp-4) var(--sp-6);border-radius:var(--r-full);background:var(--c-ember-wash)">
          <span style="width:18px;height:18px;border-radius:var(--r-full);background:var(--c-flame);animation:om-flicker 2.4s var(--ease-in-out) infinite"></span>
          <span style="font:600 var(--fs-st-200)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-flame)">Salle d'attente</span>
        </div>

        <h2 data-bind="stream.tagline" style="margin:0;font:600 var(--fs-st-600)/0.94 var(--f-display);letter-spacing:var(--tr-display);text-transform:uppercase;max-width:20ch;text-wrap:balance">Prends ton téléphone et rejoins le feu</h2>

        <div style="display:flex;align-items:center;gap:var(--gap-st);align-self:flex-start;padding:var(--sp-7) var(--sp-8);border-radius:var(--r-st);background:var(--c-surface);box-shadow:var(--sh-2),var(--sh-edge)">
          <span style="width:96px;height:96px;flex:none;border-radius:var(--r-full);background:var(--c-ember-wash);display:grid;place-items:center;color:var(--c-flame)">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3.5 19.5c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8"></path><path d="M16 6.2a3 3 0 010 5.4"></path><path d="M17.5 15c2 .5 3.2 2 3.2 4.5"></path></svg>
          </span>
          <div style="display:flex;align-items:baseline;gap:var(--sp-5)">
            <span data-bind="room.playerCount" data-testid="player-count" style="font:600 var(--fs-st-700)/0.9 var(--f-mono);letter-spacing:var(--tr-tight);color:var(--c-flame);animation:om-pop var(--mo-base) var(--ease-out)">42</span>
            <span style="font:500 var(--fs-st-300)/1 var(--f-ui);color:var(--c-ink-2)">joueurs connectés</span>
          </div>
        </div>
      </div>

      <div data-state="always" style="position:relative;width:var(--panel-st);flex:none;margin:var(--pad-st) var(--pad-st) var(--pad-st) 0;padding:var(--sp-8);border-radius:var(--r-st);background:var(--c-surface);box-shadow:var(--sh-3),var(--sh-edge);display:flex;flex-direction:column;align-items:center;gap:var(--gap-st)">
        <div style="align-self:stretch;display:flex;align-items:center;gap:var(--sp-4)">
          <div style="width:56px;height:56px;flex:none;border-radius:var(--r-s);background:var(--c-canvas-2);box-shadow:var(--sh-edge);display:grid;place-items:center;color:var(--c-flame)">
            <svg width="37" height="37" viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><g style="transform-origin:12px 16px;animation:om-flame 1.9s var(--ease-in-out) infinite"><path d="M12 2.9c3 3.7 4.5 6.1 4.5 8a4.5 4.5 0 01-9 0c0-1.7.9-3.4 2.6-5.2"></path></g><path d="M3.4 18.7l17.2-3.5"></path><path d="M3.4 15.2l17.2 3.5"></path></g><circle cx="12" cy="12.6" r="1.5" fill="currentColor" style="animation:om-spark 2.6s var(--ease-in-out) infinite"></circle></svg>
          </div>
          <p style="margin:0;font:600 var(--fs-st-200)/1.05 var(--f-display);letter-spacing:var(--tr-display);text-transform:uppercase">Project<br>Game Show</p>
        </div>
        <div data-bind="room.qr" role="img" aria-label="QR code pour rejoindre le salon" style="width:var(--qr-st);height:var(--qr-st);border-radius:var(--r-m);background:var(--c-ink);background-image:repeating-conic-gradient(from 0deg at 50% 50%, var(--c-surface) 0% 25%, transparent 0% 50%);background-size:26px 26px;box-shadow:0 0 0 var(--bw-st) var(--c-surface-2)"></div>
        <div style="align-self:stretch;display:flex;flex-direction:column;gap:var(--sp-3)">
          <p style="margin:0;font:500 var(--fs-st-100)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-ink-3)">Code du salon</p>
          <div style="height:150px;border-radius:var(--r-l);background:var(--c-surface-sunk);box-shadow:var(--sh-inset);display:grid;place-items:center">
            <p data-bind="room.code" data-testid="stream-room-code" style="margin:0;font:600 var(--fs-st-code)/1 var(--f-mono);letter-spacing:0.07em;padding-left:0.07em;color:var(--c-flame)">7KMPD</p>
          </div>
        </div>
        <div style="align-self:stretch;display:flex;flex-direction:column;gap:var(--sp-3)">
          <p style="margin:0;font:500 var(--fs-st-100)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-ink-3)">Sur ton téléphone</p>
          <div style="min-height:84px;padding:0 var(--sp-5);border-radius:var(--r-full);background:var(--c-surface-2);box-shadow:var(--sh-edge);display:grid;place-items:center">
            <span data-bind="room.joinUrl" style="font:600 var(--fs-st-200)/1 var(--f-mono);white-space:nowrap;flex:none">jeu.exemple.fr</span>
          </div>
        </div>
      </div>
    </div>
  </figure>

  <!-- ══════ 2 · AVANT LE PREMIER JOUEUR ══════ -->
  <figure style="margin:0;display:flex;flex-direction:column;gap:var(--sp-3)">
    <figcaption style="font:400 var(--fs-200)/1 var(--f-mono);color:var(--c-ink-3)">2 · cas limite : personne encore · <span style="color:var(--c-ember-bright)">data-state="waiting empty"</span></figcaption>
    <div data-state="waiting empty" data-screen-label="S2 aucun joueur" style="width:var(--stream-w);height:var(--stream-h);border-radius:var(--r-l);background:var(--c-canvas);box-shadow:var(--sh-3),var(--sh-edge);overflow:hidden;position:relative;display:flex">
      <div style="position:absolute;inset:0;background:var(--g-hearth);pointer-events:none"></div>

      <div style="position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--gap-st);padding:var(--pad-st)">
        <div style="display:flex;align-items:center;gap:var(--sp-4);align-self:flex-start;padding:var(--sp-4) var(--sp-6);border-radius:var(--r-full);background:var(--c-ember-wash)">
          <span style="width:18px;height:18px;border-radius:var(--r-full);background:var(--c-flame);animation:om-flicker 2.4s var(--ease-in-out) infinite"></span>
          <span style="font:600 var(--fs-st-200)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-flame)">Salon ouvert</span>
        </div>

        <h2 data-bind="stream.tagline" style="margin:0;font:600 var(--fs-st-600)/0.94 var(--f-display);letter-spacing:var(--tr-display);text-transform:uppercase;max-width:18ch;text-wrap:balance">Sois le premier autour du feu</h2>

        <div style="display:flex;align-items:center;gap:var(--gap-st);align-self:flex-start;padding:var(--sp-7) var(--sp-8);border-radius:var(--r-st);background:var(--c-surface);box-shadow:var(--sh-2),var(--sh-edge)">
          <div style="display:flex;gap:var(--sp-4)" aria-hidden="true">
            <span style="width:22px;height:22px;border-radius:var(--r-full);background:var(--c-flame);animation:om-breathe 1.6s var(--ease-in-out) infinite"></span>
            <span style="width:22px;height:22px;border-radius:var(--r-full);background:var(--c-flame);animation:om-breathe 1.6s var(--ease-in-out) 0.2s infinite"></span>
            <span style="width:22px;height:22px;border-radius:var(--r-full);background:var(--c-flame);animation:om-breathe 1.6s var(--ease-in-out) 0.4s infinite"></span>
          </div>
          <div style="display:flex;align-items:baseline;gap:var(--sp-5)">
            <span data-bind="room.playerCount" data-testid="player-count" style="font:600 var(--fs-st-700)/0.9 var(--f-mono);letter-spacing:var(--tr-tight);color:var(--c-ink-3)">0</span>
            <span style="font:500 var(--fs-st-300)/1 var(--f-ui);color:var(--c-ink-2)">joueur pour l'instant</span>
          </div>
        </div>
      </div>

      <div data-state="always" style="position:relative;width:var(--panel-st);flex:none;margin:var(--pad-st) var(--pad-st) var(--pad-st) 0;padding:var(--sp-8);border-radius:var(--r-st);background:var(--c-surface);box-shadow:var(--sh-3),var(--sh-edge);display:flex;flex-direction:column;align-items:center;gap:var(--gap-st)">
        <div style="align-self:stretch;display:flex;align-items:center;gap:var(--sp-4)">
          <div style="width:56px;height:56px;flex:none;border-radius:var(--r-s);background:var(--c-canvas-2);box-shadow:var(--sh-edge);display:grid;place-items:center;color:var(--c-flame)">
            <svg width="37" height="37" viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><g style="transform-origin:12px 16px;animation:om-flame 1.9s var(--ease-in-out) infinite"><path d="M12 2.9c3 3.7 4.5 6.1 4.5 8a4.5 4.5 0 01-9 0c0-1.7.9-3.4 2.6-5.2"></path></g><path d="M3.4 18.7l17.2-3.5"></path><path d="M3.4 15.2l17.2 3.5"></path></g><circle cx="12" cy="12.6" r="1.5" fill="currentColor" style="animation:om-spark 2.6s var(--ease-in-out) infinite"></circle></svg>
          </div>
          <p style="margin:0;font:600 var(--fs-st-200)/1.05 var(--f-display);letter-spacing:var(--tr-display);text-transform:uppercase">Project<br>Game Show</p>
        </div>
        <div data-bind="room.qr" role="img" aria-label="QR code pour rejoindre le salon" style="width:var(--qr-st);height:var(--qr-st);border-radius:var(--r-m);background:var(--c-ink);background-image:repeating-conic-gradient(from 0deg at 50% 50%, var(--c-surface) 0% 25%, transparent 0% 50%);background-size:26px 26px;box-shadow:0 0 0 var(--bw-st) var(--c-surface-2)"></div>
        <div style="align-self:stretch;display:flex;flex-direction:column;gap:var(--sp-3)">
          <p style="margin:0;font:500 var(--fs-st-100)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-ink-3)">Code du salon</p>
          <div style="height:150px;border-radius:var(--r-l);background:var(--c-surface-sunk);box-shadow:var(--sh-inset);display:grid;place-items:center">
            <p data-bind="room.code" data-testid="stream-room-code" style="margin:0;font:600 var(--fs-st-code)/1 var(--f-mono);letter-spacing:0.07em;padding-left:0.07em;color:var(--c-flame)">7KMPD</p>
          </div>
        </div>
        <div style="align-self:stretch;display:flex;flex-direction:column;gap:var(--sp-3)">
          <p style="margin:0;font:500 var(--fs-st-100)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-ink-3)">Sur ton téléphone</p>
          <div style="min-height:84px;padding:0 var(--sp-5);border-radius:var(--r-full);background:var(--c-surface-2);box-shadow:var(--sh-edge);display:grid;place-items:center">
            <span data-bind="room.joinUrl" style="font:600 var(--fs-st-200)/1 var(--f-mono);white-space:nowrap;flex:none">jeu.exemple.fr</span>
          </div>
        </div>
      </div>
    </div>
  </figure>

  <!-- ══════ 3 · ENTRE DEUX MANCHES ══════ -->
  <figure style="margin:0;display:flex;flex-direction:column;gap:var(--sp-3)">
    <figcaption style="font:400 var(--fs-200)/1 var(--f-mono);color:var(--c-ink-3)">3 · cas limite : entre deux épreuves · <span style="color:var(--c-ember-bright)">data-state="waiting between"</span></figcaption>
    <div data-state="waiting between" data-screen-label="S2 entre deux manches" style="width:var(--stream-w);height:var(--stream-h);border-radius:var(--r-l);background:var(--c-canvas);box-shadow:var(--sh-3),var(--sh-edge);overflow:hidden;position:relative;display:flex">
      <div style="position:absolute;inset:0;background:var(--g-hearth);pointer-events:none"></div>

      <div style="position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;gap:var(--gap-st);padding:var(--pad-st)">
        <div style="display:flex;align-items:center;gap:var(--sp-5);flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-6);border-radius:var(--r-full);background:var(--c-ember-wash)">
            <span style="width:18px;height:18px;border-radius:var(--r-full);background:var(--c-flame)"></span>
            <span style="font:600 var(--fs-st-200)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-flame)">Manche terminée</span>
          </div>
          <div style="display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-6);border-radius:var(--r-full);background:var(--c-surface);box-shadow:var(--sh-edge)">
            <span style="font:500 var(--fs-st-100)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-ink-3)">Épreuve</span>
            <span style="font:600 var(--fs-st-200)/1 var(--f-mono)"><span data-bind="module.index">8</span><span style="color:var(--c-ink-3)">/</span><span data-bind="module.total" style="color:var(--c-ink-3)">12</span></span>
          </div>
        </div>

        <h2 style="margin:0;font:600 var(--fs-st-600)/0.94 var(--f-display);letter-spacing:var(--tr-display);text-transform:uppercase;max-width:18ch;text-wrap:balance">La suite arrive</h2>
        <p style="margin:0;font:500 var(--fs-st-300)/1.35 var(--f-ui);color:var(--c-ink-2);max-width:26ch;text-wrap:pretty">Tu peux encore rejoindre : tu joues à partir de la prochaine question.</p>

        <div style="display:flex;align-items:center;gap:var(--gap-st);align-self:flex-start;padding:var(--sp-7) var(--sp-8);border-radius:var(--r-st);background:var(--c-surface);box-shadow:var(--sh-2),var(--sh-edge)">
          <span style="width:96px;height:96px;flex:none;border-radius:var(--r-full);background:var(--c-ember-wash);display:grid;place-items:center;color:var(--c-flame)">
            <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8.5" r="3.2"></circle><path d="M3.5 19.5c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8"></path><path d="M16 6.2a3 3 0 010 5.4"></path><path d="M17.5 15c2 .5 3.2 2 3.2 4.5"></path></svg>
          </span>
          <div style="display:flex;align-items:baseline;gap:var(--sp-5)">
            <span data-bind="room.playerCount" data-testid="player-count" style="font:600 var(--fs-st-700)/0.9 var(--f-mono);letter-spacing:var(--tr-tight);color:var(--c-flame)">47</span>
            <span style="font:500 var(--fs-st-300)/1 var(--f-ui);color:var(--c-ink-2)">joueurs connectés</span>
          </div>
        </div>
      </div>

      <div data-state="always" style="position:relative;width:var(--panel-st);flex:none;margin:var(--pad-st) var(--pad-st) var(--pad-st) 0;padding:var(--sp-8);border-radius:var(--r-st);background:var(--c-surface);box-shadow:var(--sh-3),var(--sh-edge);display:flex;flex-direction:column;align-items:center;gap:var(--gap-st)">
        <div style="align-self:stretch;display:flex;align-items:center;gap:var(--sp-4)">
          <div style="width:56px;height:56px;flex:none;border-radius:var(--r-s);background:var(--c-canvas-2);box-shadow:var(--sh-edge);display:grid;place-items:center;color:var(--c-flame)">
            <svg width="37" height="37" viewBox="0 0 24 24" fill="none" aria-hidden="true"><g stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><g style="transform-origin:12px 16px;animation:om-flame 1.9s var(--ease-in-out) infinite"><path d="M12 2.9c3 3.7 4.5 6.1 4.5 8a4.5 4.5 0 01-9 0c0-1.7.9-3.4 2.6-5.2"></path></g><path d="M3.4 18.7l17.2-3.5"></path><path d="M3.4 15.2l17.2 3.5"></path></g><circle cx="12" cy="12.6" r="1.5" fill="currentColor" style="animation:om-spark 2.6s var(--ease-in-out) infinite"></circle></svg>
          </div>
          <p style="margin:0;font:600 var(--fs-st-200)/1.05 var(--f-display);letter-spacing:var(--tr-display);text-transform:uppercase">Project<br>Game Show</p>
        </div>
        <div data-bind="room.qr" role="img" aria-label="QR code pour rejoindre le salon" style="width:var(--qr-st);height:var(--qr-st);border-radius:var(--r-m);background:var(--c-ink);background-image:repeating-conic-gradient(from 0deg at 50% 50%, var(--c-surface) 0% 25%, transparent 0% 50%);background-size:26px 26px;box-shadow:0 0 0 var(--bw-st) var(--c-surface-2)"></div>
        <div style="align-self:stretch;display:flex;flex-direction:column;gap:var(--sp-3)">
          <p style="margin:0;font:500 var(--fs-st-100)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-ink-3)">Code du salon</p>
          <div style="height:150px;border-radius:var(--r-l);background:var(--c-surface-sunk);box-shadow:var(--sh-inset);display:grid;place-items:center">
            <p data-bind="room.code" data-testid="stream-room-code" style="margin:0;font:600 var(--fs-st-code)/1 var(--f-mono);letter-spacing:0.07em;padding-left:0.07em;color:var(--c-flame)">7KMPD</p>
          </div>
        </div>
        <div style="align-self:stretch;display:flex;flex-direction:column;gap:var(--sp-3)">
          <p style="margin:0;font:500 var(--fs-st-100)/1 var(--f-ui);letter-spacing:var(--tr-label);text-transform:uppercase;color:var(--c-ink-3)">Sur ton téléphone</p>
          <div style="min-height:84px;padding:0 var(--sp-5);border-radius:var(--r-full);background:var(--c-surface-2);box-shadow:var(--sh-edge);display:grid;place-items:center">
            <span data-bind="room.joinUrl" style="font:600 var(--fs-st-200)/1 var(--f-mono);white-space:nowrap;flex:none">jeu.exemple.fr</span>
          </div>
        </div>
      </div>
    </div>
  </figure>
</div>
</x-dc>
</body>
</html>
