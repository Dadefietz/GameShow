<!-- artifact: mockup; app:root; screen:host-live; version:1; produced_by:design-builder -->
<!-- A11Y: focus=ordre logique, anneau 2px action-primary offset 2px; contrast=texte neutral-100/bg-page 16.6:1 AAA; aria=main+nav landmarks, boutons role implicite; touch=44px min -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Game Show — Pilotage en direct</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    .page {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: var(--semantic-color-bg-page);
      color: var(--semantic-color-text-primary);
      font-family: var(--font-family-text);
      font-size: var(--font-size-step-0);
      line-height: var(--font-line-height-normal);
    }
    :focus-visible {
      outline: 2px solid var(--semantic-color-action-primary);
      outline-offset: 2px;
      border-radius: var(--size-radius-sm);
    }

    /* COMPOSANT: LiveHeader */
    .live-header {
      display: flex;
      align-items: center;
      gap: var(--size-space-6);
      padding: var(--size-space-4) var(--size-space-7);
      border-bottom: 1px solid var(--semantic-color-border);
      background: var(--semantic-color-bg-surface);
    }
    .live-header__brand { display: flex; align-items: center; gap: var(--size-space-3); }
    .live-header__emblem {
      display: inline-grid; place-items: center;
      width: 38px; height: 38px;
      border-radius: var(--size-radius-full);
      color: var(--semantic-color-action-primary);
      background: color-mix(in oklch, var(--semantic-color-action-primary) 16%, transparent);
    }
    .live-header__emblem svg { width: 20px; height: 20px; }
    .live-header__room {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-step-1);
      letter-spacing: 0.05em;
    }
    .live-header__stats { display: flex; align-items: center; gap: var(--size-space-3); margin-left: auto; }
    /* /COMPOSANT: LiveHeader */

    /* COMPOSANT: StatChip */
    .stat-chip {
      display: inline-flex;
      align-items: center;
      gap: var(--size-space-2);
      padding: var(--size-space-2) var(--size-space-4);
      border-radius: var(--size-radius-full);
      background: var(--semantic-color-bg-elevated);
      border: 1px solid var(--semantic-color-border);
      font-size: var(--font-size-step--1);
      font-weight: var(--font-weight-medium);
    }
    .stat-chip svg { width: 18px; height: 18px; }
    .stat-chip--progress { color: var(--semantic-color-heading); font-weight: var(--font-weight-semibold); }
    .stat-chip--live {
      color: var(--semantic-color-status-danger);
      background: color-mix(in oklch, var(--semantic-color-status-danger) 16%, transparent);
      border-color: color-mix(in oklch, var(--semantic-color-status-danger) 40%, transparent);
      font-weight: var(--font-weight-semibold);
    }
    .stat-chip__dot { width: 8px; height: 8px; border-radius: var(--size-radius-full); background: currentColor; }
    /* /COMPOSANT: StatChip */

    .live-body {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: var(--size-space-6);
      padding: var(--size-space-6) var(--size-space-7);
    }

    /* COMPOSANT: QuestionHero */
    .hero {
      position: relative;
      background: var(--component-card-bg);
      border: 1px solid var(--component-card-border);
      border-radius: var(--size-radius-xl);
      padding: var(--size-space-8) var(--size-space-7);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 60% 50% at 30% 12%, color-mix(in oklch, var(--semantic-color-signature) 20%, transparent), transparent 60%),
        radial-gradient(ellipse 55% 45% at 90% 90%, color-mix(in oklch, var(--semantic-color-action-primary) 15%, transparent), transparent 65%);
    }
    .hero__tag {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: var(--size-space-2);
      align-self: flex-start;
      padding: var(--size-space-2) var(--size-space-4);
      border-radius: var(--size-radius-full);
      background: color-mix(in oklch, var(--semantic-color-action-primary) 20%, transparent);
      color: var(--semantic-color-action-primary);
      font-size: var(--font-size-step--1);
      font-weight: var(--font-weight-semibold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .hero__tag svg { width: 16px; height: 16px; }
    .hero__question {
      position: relative;
      margin: var(--size-space-5) 0 var(--size-space-7);
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-step-4);
      line-height: var(--font-line-height-snug);
      color: var(--semantic-color-text-primary);
      max-width: 22ch;
    }
    .hero__meters {
      position: relative;
      margin-top: auto;
      display: flex;
      align-items: flex-end;
      gap: var(--size-space-8);
      flex-wrap: wrap;
    }
    .hero__signature {
      display: flex;
      flex-direction: column;
    }
    .hero__count {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-black);
      font-size: var(--font-size-display-hero);
      line-height: 0.9;
      color: var(--semantic-color-signature);
      text-shadow: 0 0 60px color-mix(in oklch, var(--semantic-color-signature) 45%, transparent);
    }
    .hero__count-label {
      margin-top: var(--size-space-2);
      font-size: var(--font-size-step-0);
      color: var(--semantic-color-text-secondary);
    }
    /* /COMPOSANT: QuestionHero */

    /* COMPOSANT: Timer */
    .timer {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--size-space-2);
      padding: var(--size-space-5) var(--size-space-6);
      border-radius: var(--size-radius-lg);
      background: color-mix(in oklch, var(--semantic-color-action-primary) 12%, transparent);
      border: 1px solid color-mix(in oklch, var(--semantic-color-action-primary) 45%, transparent);
    }
    .timer__value {
      display: flex;
      align-items: baseline;
      gap: var(--size-space-2);
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-black);
      font-size: var(--font-size-step-6);
      line-height: 1;
      color: var(--semantic-color-signature);
    }
    .timer__unit { font-size: var(--font-size-step-2); color: var(--semantic-color-action-primary); }
    .timer__label {
      display: inline-flex;
      align-items: center;
      gap: var(--size-space-2);
      font-size: var(--font-size-step--1);
      color: var(--semantic-color-text-secondary);
    }
    .timer__label svg { width: 16px; height: 16px; }
    /* /COMPOSANT: Timer */

    /* COMPOSANT: Leaderboard */
    .leaderboard {
      background: var(--component-card-bg);
      border: 1px solid var(--component-card-border);
      border-radius: var(--size-radius-xl);
      padding: var(--size-space-6);
      display: flex;
      flex-direction: column;
    }
    .leaderboard__title {
      display: flex;
      align-items: center;
      gap: var(--size-space-2);
      margin: 0 0 var(--size-space-5);
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-step-2);
      color: var(--semantic-color-heading);
    }
    .leaderboard__title svg { width: 22px; height: 22px; }
    .leaderboard__list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--size-space-3); }
    .leaderboard__row {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: var(--size-space-3);
      padding: var(--size-space-3) var(--size-space-4);
      border-radius: var(--size-radius-md);
      background: var(--semantic-color-bg-elevated);
      border: 1px solid transparent;
    }
    .leaderboard__row--lead {
      background: color-mix(in oklch, var(--semantic-color-signature) 14%, transparent);
      border-color: color-mix(in oklch, var(--semantic-color-signature) 50%, transparent);
    }
    .leaderboard__rank {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-step-1);
      color: var(--semantic-color-text-secondary);
      text-align: center;
    }
    .leaderboard__row--lead .leaderboard__rank { color: var(--semantic-color-signature); }
    .leaderboard__name { font-weight: var(--font-weight-medium); }
    .leaderboard__score {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-semibold);
      font-variant-numeric: tabular-nums;
    }
    /* /COMPOSANT: Leaderboard */

    /* COMPOSANT: HostControlBar */
    .control-bar {
      display: flex;
      flex-wrap: wrap;
      gap: var(--size-space-3);
      padding: var(--size-space-5) var(--size-space-7);
      border-top: 1px solid var(--semantic-color-border);
      background: var(--semantic-color-bg-surface);
    }
    .control-bar__spacer { flex: 1; }
    /* /COMPOSANT: HostControlBar */

    /* COMPOSANT: Button */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--size-space-2);
      min-height: var(--size-touch-min);
      padding: var(--size-space-3) var(--size-space-5);
      border: 1px solid transparent;
      border-radius: var(--size-radius-md);
      font-family: inherit;
      font-size: var(--font-size-step-0);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition:
        background-color var(--motion-duration-base) var(--motion-easing-standard),
        transform var(--motion-duration-fast) var(--motion-easing-emphasized);
    }
    .button svg { width: 20px; height: 20px; }
    .button--primary {
      background: var(--component-button-bg);
      color: var(--component-button-text);
      box-shadow: 0 10px 28px color-mix(in oklch, var(--semantic-color-action-primary) 34%, transparent);
    }
    .button--primary:hover { background: var(--component-button-bg-hover); transform: translateY(-1px); }
    .button--forest {
      background: var(--semantic-color-action-secondary);
      color: var(--semantic-color-action-on-forest);
    }
    .button--forest:hover { transform: translateY(-1px); }
    .button--ghost {
      background: var(--semantic-color-bg-elevated);
      color: var(--semantic-color-text-primary);
      border-color: var(--semantic-color-border);
    }
    .button--ghost:hover { background: color-mix(in oklch, var(--semantic-color-text-primary) 8%, var(--semantic-color-bg-elevated)); }
    .button--outline {
      background: transparent;
      color: var(--semantic-color-text-primary);
      border-color: var(--semantic-color-border);
    }
    .button--outline:hover { border-color: var(--semantic-color-action-primary); }
    /* /COMPOSANT: Button */
  </style>
</head>
<body class="page">
  <!-- COMPOSANT: LiveHeader -->
  <header class="live-header">
    <nav class="live-header__brand" aria-label="Salon">
      <span class="live-header__emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      </span>
      <span class="live-header__room">Salon 9JAKL</span>
    </nav>
    <div class="live-header__stats">
      <!-- COMPOSANT: StatChip -->
      <span class="stat-chip stat-chip--live">
        <span class="stat-chip__dot" aria-hidden="true"></span>
        En direct
      </span>
      <span class="stat-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        873 joueurs
      </span>
      <span class="stat-chip stat-chip--progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></svg>
        Épreuve 4 / 12
      </span>
      <!-- /COMPOSANT: StatChip -->
    </div>
  </header>
  <!-- /COMPOSANT: LiveHeader -->

  <main class="live-body" role="main">
    <!-- COMPOSANT: QuestionHero -->
    <section class="hero" aria-labelledby="hero-question">
      <span class="hero__tag">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="10"/></svg>
        Quiz
      </span>
      <h1 class="hero__question" id="hero-question">Quelle est la plus haute montagne d'Europe ?</h1>
      <div class="hero__meters">
        <div class="hero__signature">
          <span class="hero__count">832</span>
          <span class="hero__count-label">réponses reçues</span>
        </div>
        <!-- COMPOSANT: Timer -->
        <div class="timer" role="timer" aria-label="Temps restant 14 secondes">
          <span class="timer__value">14<span class="timer__unit">s</span></span>
          <span class="timer__label">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            temps restant
          </span>
        </div>
        <!-- /COMPOSANT: Timer -->
      </div>
    </section>
    <!-- /COMPOSANT: QuestionHero -->

    <!-- COMPOSANT: Leaderboard -->
    <aside class="leaderboard" aria-label="Classement en direct">
      <h2 class="leaderboard__title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
        Top 5 en direct
      </h2>
      <ol class="leaderboard__list">
        <li class="leaderboard__row leaderboard__row--lead">
          <span class="leaderboard__rank">1</span>
          <span class="leaderboard__name">PixelNight</span>
          <span class="leaderboard__score">1 250</span>
        </li>
        <li class="leaderboard__row">
          <span class="leaderboard__rank">2</span>
          <span class="leaderboard__name">LunaVibe</span>
          <span class="leaderboard__score">1 180</span>
        </li>
        <li class="leaderboard__row">
          <span class="leaderboard__rank">3</span>
          <span class="leaderboard__name">FreeZe</span>
          <span class="leaderboard__score">1 045</span>
        </li>
        <li class="leaderboard__row">
          <span class="leaderboard__rank">4</span>
          <span class="leaderboard__name">SkyLynn</span>
          <span class="leaderboard__score">930</span>
        </li>
        <li class="leaderboard__row">
          <span class="leaderboard__rank">5</span>
          <span class="leaderboard__name">DarkShadow</span>
          <span class="leaderboard__score">870</span>
        </li>
      </ol>
    </aside>
    <!-- /COMPOSANT: Leaderboard -->
  </main>

  <!-- COMPOSANT: HostControlBar -->
  <nav class="control-bar" aria-label="Contrôles animateur">
    <!-- COMPOSANT: Button -->
    <button class="button button--primary" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
      Afficher les résultats
    </button>
    <button class="button button--forest" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="5 4 15 12 5 20 5 4"/><line x1="19" x2="19" y1="5" y2="19"/></svg>
      Passer à la suivante
    </button>
    <button class="button button--ghost" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/></svg>
      Événements
    </button>
    <button class="button button--ghost" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>
      Bonus / Malus
    </button>
    <span class="control-bar__spacer"></span>
    <button class="button button--outline" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>
      Pause
    </button>
    <!-- /COMPOSANT: Button -->
  </nav>
  <!-- /COMPOSANT: HostControlBar -->
</body>
</html>
