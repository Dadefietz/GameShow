<!-- artifact: mockup; app:root; screen:host-lobby; version:1; produced_by:design-builder -->
<!-- A11Y: focus=ordre logique, anneau 2px action-primary offset 2px; contrast=texte neutral-100/bg-page 16.6:1 AAA; aria=main+nav landmarks, boutons role implicite; touch=44px min -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Game Show — Salon d'attente</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    .page {
      margin: 0;
      min-height: 100vh;
      background: var(--semantic-color-bg-page);
      color: var(--semantic-color-text-primary);
      font-family: var(--font-family-text);
      font-size: var(--font-size-step-0);
      line-height: var(--font-line-height-normal);
    }
    :focus-visible {
      outline: 2px solid var(--semantic-color-action-primary);
      outline-offset: 2px;
      border-radius: var(--size-radius-sm);
    }

    /* COMPOSANT: TopBar */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--size-space-4);
      padding: var(--size-space-4) var(--size-space-7);
      border-bottom: 1px solid var(--semantic-color-border);
      background: var(--semantic-color-bg-surface);
    }
    .topbar__brand { display: flex; align-items: center; gap: var(--size-space-3); }
    .topbar__emblem {
      display: inline-grid;
      place-items: center;
      width: 40px; height: 40px;
      border-radius: var(--size-radius-full);
      color: var(--semantic-color-action-primary);
      background: color-mix(in oklch, var(--semantic-color-action-primary) 16%, transparent);
    }
    .topbar__emblem svg { width: 22px; height: 22px; }
    .topbar__name {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-step-1);
    }
    /* /COMPOSANT: TopBar */

    /* COMPOSANT: StatusPill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: var(--size-space-2);
      padding: var(--size-space-2) var(--size-space-4);
      border-radius: var(--size-radius-full);
      font-size: var(--font-size-step--1);
      font-weight: var(--font-weight-semibold);
      background: color-mix(in oklch, var(--semantic-color-status-warning) 18%, transparent);
      color: var(--semantic-color-status-warning);
    }
    .status-pill__dot {
      width: 8px; height: 8px;
      border-radius: var(--size-radius-full);
      background: currentColor;
    }
    /* /COMPOSANT: StatusPill */

    .lobby {
      max-width: 1120px;
      margin: 0 auto;
      padding: var(--size-space-8) var(--size-space-7) var(--size-space-9);
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: var(--size-space-7);
      align-items: start;
    }

    /* COMPOSANT: JoinCard */
    .join-card {
      position: relative;
      background: var(--component-card-bg);
      border: 1px solid var(--component-card-border);
      border-radius: var(--size-radius-xl);
      padding: var(--size-space-8) var(--size-space-7);
      text-align: center;
      overflow: hidden;
    }
    .join-card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 70% 55% at 50% 0%, color-mix(in oklch, var(--semantic-color-signature) 18%, transparent), transparent 65%);
    }
    .join-card__label {
      position: relative;
      margin: 0 0 var(--size-space-3);
      font-size: var(--font-size-step--1);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: var(--font-weight-semibold);
      color: var(--semantic-color-text-secondary);
    }
    .join-card__code {
      position: relative;
      margin: 0;
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-black);
      font-size: var(--font-size-step-6);
      letter-spacing: 0.08em;
      line-height: var(--font-line-height-tight);
      color: var(--semantic-color-signature);
      text-shadow: 0 0 44px color-mix(in oklch, var(--semantic-color-signature) 45%, transparent);
    }
    .join-card__hint {
      position: relative;
      margin: var(--size-space-5) 0 0;
      color: var(--semantic-color-text-secondary);
      font-size: var(--font-size-step-0);
    }
    .join-card__url { color: var(--semantic-color-heading); font-weight: var(--font-weight-semibold); }
    /* /COMPOSANT: JoinCard */

    /* COMPOSANT: QrPlate */
    .qr-plate {
      position: relative;
      width: 148px; height: 148px;
      margin: var(--size-space-6) auto 0;
      display: grid;
      place-items: center;
      border-radius: var(--size-radius-lg);
      color: var(--semantic-color-text-primary);
      background:
        repeating-linear-gradient(0deg, color-mix(in oklch, var(--color-neutral-100) 90%, transparent) 0 6px, transparent 6px 12px),
        repeating-linear-gradient(90deg, color-mix(in oklch, var(--color-neutral-100) 90%, transparent) 0 6px, transparent 6px 12px),
        var(--color-neutral-950);
      border: 6px solid var(--color-neutral-100);
    }
    .qr-plate__icon {
      display: grid; place-items: center;
      width: 74px; height: 74px;
      border-radius: var(--size-radius-md);
      background: var(--color-neutral-950);
      color: var(--color-neutral-100);
    }
    .qr-plate__icon svg { width: 46px; height: 46px; }
    /* /COMPOSANT: QrPlate */

    .lobby__side { display: flex; flex-direction: column; gap: var(--size-space-6); }

    /* COMPOSANT: CountCard */
    .count-card {
      display: flex;
      align-items: center;
      gap: var(--size-space-4);
      background: var(--component-card-bg);
      border: 1px solid var(--component-card-border);
      border-radius: var(--size-radius-lg);
      padding: var(--size-space-5) var(--size-space-6);
    }
    .count-card__icon {
      display: grid; place-items: center;
      width: 52px; height: 52px;
      border-radius: var(--size-radius-md);
      color: var(--semantic-color-action-secondary);
      background: color-mix(in oklch, var(--semantic-color-action-secondary) 16%, transparent);
    }
    .count-card__icon svg { width: 26px; height: 26px; }
    .count-card__value {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-step-3);
      line-height: var(--font-line-height-tight);
    }
    .count-card__label { color: var(--semantic-color-text-secondary); font-size: var(--font-size-step--1); }
    /* /COMPOSANT: CountCard */

    /* COMPOSANT: PlayerFlock */
    .flock {
      background: var(--component-card-bg);
      border: 1px solid var(--component-card-border);
      border-radius: var(--size-radius-lg);
      padding: var(--size-space-5) var(--size-space-6);
    }
    .flock__title {
      margin: 0 0 var(--size-space-4);
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-semibold);
      font-size: var(--font-size-step-1);
      color: var(--semantic-color-heading);
    }
    .flock__list {
      list-style: none;
      margin: 0; padding: 0;
      display: flex;
      flex-wrap: wrap;
      gap: var(--size-space-2);
    }
    .flock__chip {
      display: inline-flex;
      align-items: center;
      gap: var(--size-space-2);
      padding: var(--size-space-2) var(--size-space-4);
      border-radius: var(--size-radius-full);
      background: var(--semantic-color-bg-elevated);
      border: 1px solid var(--semantic-color-border);
      font-size: var(--font-size-step--1);
      font-weight: var(--font-weight-medium);
    }
    .flock__chip::before {
      content: "";
      width: 7px; height: 7px;
      border-radius: var(--size-radius-full);
      background: var(--semantic-color-action-secondary);
    }
    .flock__chip--fresh { border-color: color-mix(in oklch, var(--semantic-color-action-primary) 55%, transparent); }
    /* /COMPOSANT: PlayerFlock */

    /* COMPOSANT: Button */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--size-space-2);
      min-height: var(--size-touch-min);
      padding: var(--size-space-4) var(--size-space-6);
      border: none;
      border-radius: var(--size-radius-md);
      font-family: inherit;
      font-size: var(--font-size-step-1);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition:
        background-color var(--motion-duration-base) var(--motion-easing-standard),
        transform var(--motion-duration-fast) var(--motion-easing-emphasized);
    }
    .button svg { width: 22px; height: 22px; }
    .button--primary {
      width: 100%;
      background: var(--component-button-bg);
      color: var(--component-button-text);
      box-shadow: 0 12px 34px color-mix(in oklch, var(--semantic-color-action-primary) 36%, transparent);
    }
    .button--primary:hover { background: var(--component-button-bg-hover); transform: translateY(-1px); }
    /* /COMPOSANT: Button */
  </style>
</head>
<body class="page">
  <!-- COMPOSANT: TopBar -->
  <header class="topbar">
    <nav class="topbar__brand" aria-label="Marque">
      <span class="topbar__emblem" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
      </span>
      <span class="topbar__name">Project Game Show</span>
    </nav>
    <!-- COMPOSANT: StatusPill -->
    <span class="status-pill">
      <span class="status-pill__dot" aria-hidden="true"></span>
      En attente
    </span>
    <!-- /COMPOSANT: StatusPill -->
  </header>
  <!-- /COMPOSANT: TopBar -->

  <main class="lobby" role="main">
    <!-- COMPOSANT: JoinCard -->
    <section class="join-card" aria-labelledby="join-label">
      <p class="join-card__label" id="join-label">Code de la salle</p>
      <p class="join-card__code">9JAKL</p>
      <!-- COMPOSANT: QrPlate -->
      <div class="qr-plate" role="img" aria-label="QR code de la salle">
        <span class="qr-plate__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="5" height="5" x="3" y="3" rx="1"/><rect width="5" height="5" x="16" y="3" rx="1"/><rect width="5" height="5" x="3" y="16" rx="1"/><path d="M21 16h-3a2 2 0 0 0-2 2v3"/><path d="M21 21v.01"/><path d="M12 7v3a2 2 0 0 1-2 2H7"/><path d="M3 12h.01"/><path d="M12 3h.01"/><path d="M12 16v.01"/><path d="M16 12h1"/><path d="M21 12v.01"/><path d="M12 21v-1"/></svg>
        </span>
      </div>
      <!-- /COMPOSANT: QrPlate -->
      <p class="join-card__hint">Scannez ou entrez le code sur <span class="join-card__url">play.tonjeu.fr</span></p>
    </section>
    <!-- /COMPOSANT: JoinCard -->

    <div class="lobby__side">
      <!-- COMPOSANT: CountCard -->
      <div class="count-card">
        <span class="count-card__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </span>
        <div>
          <div class="count-card__value">873</div>
          <div class="count-card__label">joueurs connectés</div>
        </div>
      </div>
      <!-- /COMPOSANT: CountCard -->

      <!-- COMPOSANT: PlayerFlock -->
      <section class="flock" aria-label="Joueurs qui rejoignent">
        <h2 class="flock__title">Ils arrivent au feu</h2>
        <ul class="flock__list">
          <li class="flock__chip">PixelNight</li>
          <li class="flock__chip">LunaVibe</li>
          <li class="flock__chip">FreeZe</li>
          <li class="flock__chip">SkyLynn</li>
          <li class="flock__chip">DarkShadow</li>
          <li class="flock__chip">NovaKid</li>
          <li class="flock__chip">EmberFox</li>
          <li class="flock__chip flock__chip--fresh">MystiCat</li>
          <li class="flock__chip flock__chip--fresh">RavenZ</li>
          <li class="flock__chip flock__chip--fresh">SoloWave</li>
        </ul>
      </section>
      <!-- /COMPOSANT: PlayerFlock -->

      <!-- COMPOSANT: Button -->
      <button class="button button--primary" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="6 3 20 12 6 21 6 3"/></svg>
        Lancer la partie
      </button>
      <!-- /COMPOSANT: Button -->
    </div>
  </main>
</body>
</html>
