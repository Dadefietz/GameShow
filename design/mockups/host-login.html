<!-- artifact: mockup; app:root; screen:host-login; version:1; produced_by:design-builder -->
<!-- A11Y: focus=ordre logique, anneau 2px action-primary offset 2px; contrast=texte neutral-100/bg-page 16.6:1 AAA; aria=main+nav landmarks, boutons role implicite; touch=44px min -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Game Show — Connexion animateur</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    .page {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--size-space-6);
      background: var(--semantic-color-bg-page);
      color: var(--semantic-color-text-primary);
      font-family: var(--font-family-text);
      font-size: var(--font-size-step-0);
      line-height: var(--font-line-height-normal);
    }
    /* lueur feu de camp derrière la carte, construite en color-mix de tokens */
    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 55% 45% at 50% 42%, color-mix(in oklch, var(--semantic-color-signature) 20%, transparent), transparent 62%),
        radial-gradient(ellipse 70% 60% at 50% 100%, color-mix(in oklch, var(--semantic-color-action-primary) 16%, transparent), transparent 70%);
    }

    :focus-visible {
      outline: 2px solid var(--semantic-color-action-primary);
      outline-offset: 2px;
      border-radius: var(--size-radius-sm);
    }

    /* COMPOSANT: AuthCard */
    .auth-card {
      position: relative;
      width: min(440px, 100%);
      background: var(--component-card-bg);
      border: 1px solid var(--component-card-border);
      border-radius: var(--size-radius-xl);
      padding: var(--size-space-8) var(--size-space-7);
      box-shadow: 0 24px 70px color-mix(in oklch, var(--color-neutral-950) 66%, transparent);
      text-align: center;
    }
    .auth-card__emblem {
      display: inline-grid;
      place-items: center;
      width: 68px;
      height: 68px;
      margin-bottom: var(--size-space-5);
      border-radius: var(--size-radius-full);
      color: var(--semantic-color-action-primary);
      background: color-mix(in oklch, var(--semantic-color-action-primary) 16%, transparent);
      box-shadow: 0 0 34px color-mix(in oklch, var(--semantic-color-signature) 34%, transparent);
    }
    .auth-card__emblem svg { width: 34px; height: 34px; }
    .auth-card__title {
      margin: 0 0 var(--size-space-2);
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-black);
      font-size: var(--font-size-step-4);
      line-height: var(--font-line-height-tight);
      color: var(--semantic-color-text-primary);
    }
    .auth-card__subtitle {
      margin: 0 0 var(--size-space-7);
      font-size: var(--font-size-step-0);
      color: var(--semantic-color-text-secondary);
    }
    /* /COMPOSANT: AuthCard */

    /* COMPOSANT: Field */
    .field { text-align: left; margin-bottom: var(--size-space-5); }
    .field__label {
      display: block;
      margin-bottom: var(--size-space-2);
      font-size: var(--font-size-step--1);
      font-weight: var(--font-weight-semibold);
      color: var(--semantic-color-text-secondary);
    }
    .field__control {
      display: flex;
      align-items: center;
      gap: var(--size-space-3);
      padding: 0 var(--size-space-4);
      min-height: var(--size-touch-min);
      border-radius: var(--size-radius-md);
      background: var(--semantic-color-bg-elevated);
      border: 1px solid var(--semantic-color-border);
      transition: border-color var(--motion-duration-fast) var(--motion-easing-standard);
    }
    .field__control:focus-within {
      border-color: var(--semantic-color-action-primary);
    }
    .field__icon { color: var(--semantic-color-text-secondary); display: inline-flex; }
    .field__icon svg { width: 20px; height: 20px; }
    .field__input {
      flex: 1;
      min-width: 0;
      border: none;
      background: transparent;
      color: var(--semantic-color-text-primary);
      font-family: inherit;
      font-size: var(--font-size-step-0);
      padding: var(--size-space-3) 0;
    }
    .field__input:focus { outline: none; }
    .field__input::placeholder { color: var(--semantic-color-text-secondary); }
    /* /COMPOSANT: Field */

    /* COMPOSANT: Button */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--size-space-2);
      width: 100%;
      min-height: var(--size-touch-min);
      padding: var(--size-space-3) var(--size-space-5);
      border: none;
      border-radius: var(--size-radius-md);
      font-family: inherit;
      font-size: var(--font-size-step-0);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition:
        background-color var(--motion-duration-base) var(--motion-easing-standard),
        transform var(--motion-duration-fast) var(--motion-easing-emphasized);
    }
    .button svg { width: 20px; height: 20px; }
    .button--primary {
      background: var(--component-button-bg);
      color: var(--component-button-text);
      box-shadow: 0 10px 30px color-mix(in oklch, var(--semantic-color-action-primary) 34%, transparent);
    }
    .button--primary:hover { background: var(--component-button-bg-hover); transform: translateY(-1px); }
    /* /COMPOSANT: Button */

    .auth-card__note {
      margin: var(--size-space-6) 0 0;
      font-size: var(--font-size-step--1);
      color: var(--semantic-color-text-secondary);
    }
  </style>
</head>
<body class="page">
  <main class="auth-card" role="main" aria-labelledby="auth-title">
    <!-- COMPOSANT: AuthCard -->
    <span class="auth-card__emblem" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>
    </span>
    <h1 class="auth-card__title" id="auth-title">Project Game Show</h1>
    <p class="auth-card__subtitle">Le plateau de jeu autour du feu. Connectez-vous pour animer votre partie.</p>

    <form action="#" method="post" novalidate>
      <!-- COMPOSANT: Field -->
      <div class="field">
        <label class="field__label" for="host-email">Adresse email de l'animateur</label>
        <div class="field__control">
          <span class="field__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          </span>
          <input class="field__input" id="host-email" type="email" name="email" placeholder="vous@exemple.fr" autocomplete="email">
        </div>
      </div>
      <!-- /COMPOSANT: Field -->

      <!-- COMPOSANT: Button -->
      <button class="button button--primary" type="submit">
        Recevoir le code
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
      </button>
      <!-- /COMPOSANT: Button -->
    </form>

    <p class="auth-card__note">Un seul animateur — accès par code email (OTP).</p>
    <!-- /COMPOSANT: AuthCard -->
  </main>
</body>
</html>
