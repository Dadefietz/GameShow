<!-- A11Y: focus=ordre logique, anneau 2px action-primary offset 2px; contrast=texte neutral-100/bg-page 16.6:1 AAA; aria=main+nav landmarks, boutons role implicite; touch=44px min -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project Game Show — Classement</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    .page {
      margin: 0;
      min-height: 100vh;
      background: var(--semantic-color-bg-page);
      color: var(--semantic-color-text-primary);
      font-family: var(--font-family-text);
      font-size: var(--font-size-step-0);
      line-height: var(--font-line-height-normal);
    }
    .page::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 60% 45% at 50% 8%, color-mix(in oklch, var(--semantic-color-signature) 16%, transparent), transparent 60%);
    }
    :focus-visible {
      outline: 2px solid var(--semantic-color-action-primary);
      outline-offset: 2px;
      border-radius: var(--size-radius-sm);
    }

    .results {
      position: relative;
      max-width: 880px;
      margin: 0 auto;
      padding: var(--size-space-8) var(--size-space-7) var(--size-space-9);
    }
    .results__title {
      margin: 0 0 var(--size-space-8);
      text-align: center;
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-black);
      font-size: var(--font-size-step-5);
      line-height: var(--font-line-height-tight);
      color: var(--semantic-color-heading);
    }

    /* COMPOSANT: Podium */
    .podium {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: end;
      gap: var(--size-space-5);
      margin-bottom: var(--size-space-8);
    }
    .podium__slot { display: flex; flex-direction: column; align-items: center; }
    .podium__crown { color: var(--semantic-color-signature); margin-bottom: var(--size-space-2); }
    .podium__crown svg { width: 34px; height: 34px; }
    .podium__name {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-step-1);
      margin-bottom: var(--size-space-1);
      text-align: center;
    }
    .podium__score {
      font-variant-numeric: tabular-nums;
      color: var(--semantic-color-text-secondary);
      font-weight: var(--font-weight-semibold);
      margin-bottom: var(--size-space-3);
    }
    .podium__step {
      width: 100%;
      display: grid;
      place-items: center;
      border-radius: var(--size-radius-lg) var(--size-radius-lg) 0 0;
      background: var(--component-card-bg);
      border: 1px solid var(--component-card-border);
      border-bottom: none;
    }
    .podium__rank {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-black);
      font-size: var(--font-size-step-4);
      color: var(--semantic-color-text-secondary);
    }
    .podium__slot--first .podium__step {
      height: 180px;
      background: color-mix(in oklch, var(--semantic-color-signature) 16%, var(--component-card-bg));
      border-color: color-mix(in oklch, var(--semantic-color-signature) 55%, transparent);
    }
    .podium__slot--first .podium__rank { color: var(--semantic-color-signature); font-size: var(--font-size-step-5); }
    .podium__slot--first .podium__name { color: var(--semantic-color-signature); font-size: var(--font-size-step-2); }
    .podium__slot--second .podium__step { height: 132px; }
    .podium__slot--third .podium__step { height: 104px; }
    /* /COMPOSANT: Podium */

    /* COMPOSANT: RankList */
    .rank-list {
      list-style: none;
      margin: 0 0 var(--size-space-8);
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: var(--size-space-2);
    }
    .rank-list__row {
      display: grid;
      grid-template-columns: 40px 1fr auto;
      align-items: center;
      gap: var(--size-space-4);
      padding: var(--size-space-4) var(--size-space-5);
      border-radius: var(--size-radius-md);
      background: var(--component-card-bg);
      border: 1px solid var(--component-card-border);
    }
    .rank-list__rank {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-bold);
      font-size: var(--font-size-step-1);
      color: var(--semantic-color-text-secondary);
      text-align: center;
    }
    .rank-list__name { font-weight: var(--font-weight-medium); }
    .rank-list__score {
      font-family: var(--font-family-display);
      font-weight: var(--font-weight-semibold);
      font-variant-numeric: tabular-nums;
    }
    /* /COMPOSANT: RankList */

    /* COMPOSANT: ActionRow */
    .action-row { display: flex; flex-wrap: wrap; gap: var(--size-space-4); justify-content: center; }
    /* /COMPOSANT: ActionRow */

    /* COMPOSANT: Button */
    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--size-space-2);
      min-height: var(--size-touch-min);
      padding: var(--size-space-4) var(--size-space-7);
      border: 1px solid transparent;
      border-radius: var(--size-radius-md);
      font-family: inherit;
      font-size: var(--font-size-step-0);
      font-weight: var(--font-weight-semibold);
      cursor: pointer;
      transition:
        background-color var(--motion-duration-base) var(--motion-easing-standard),
        transform var(--motion-duration-fast) var(--motion-easing-emphasized),
        border-color var(--motion-duration-base) var(--motion-easing-standard);
    }
    .button svg { width: 20px; height: 20px; }
    .button--primary {
      background: var(--component-button-bg);
      color: var(--component-button-text);
      box-shadow: 0 12px 32px color-mix(in oklch, var(--semantic-color-action-primary) 36%, transparent);
    }
    .button--primary:hover { background: var(--component-button-bg-hover); transform: translateY(-1px); }
    .button--outline-danger {
      background: transparent;
      color: var(--semantic-color-status-danger);
      border-color: color-mix(in oklch, var(--semantic-color-status-danger) 55%, transparent);
    }
    .button--outline-danger:hover {
      background: color-mix(in oklch, var(--semantic-color-status-danger) 14%, transparent);
      border-color: var(--semantic-color-status-danger);
    }
    /* /COMPOSANT: Button */
  </style>
</head>
<body class="page">

    <!-- COMPOSANT: RankList -->

    </ol>
    <!-- /COMPOSANT: RankList -->

    <!-- COMPOSANT: ActionRow -->
    <div class="action-row">
      <!-- COMPOSANT: Button -->
      <button class="button button--primary" type="button">

        Terminer la partie
      </button>

    </div>

  </main>
</body>
</html>
