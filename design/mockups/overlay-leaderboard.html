<!-- artifact: mockup; app:root; screen:overlay-leaderboard; version:1; produced_by:design-builder -->
<!-- A11Y: focus=n/a (overlay display-only, non interactif); contrast=texte crème/plaque sombre color-mix >=4.5:1; aria=n/a display-only; touch=n/a -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay — Classement</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  /* FOND TRANSPARENT obligatoire pour OBS */
  html, body { background: transparent; margin: 0; padding: 0; }

  .overlay {
    position: relative;
    width: 1920px;
    height: 1080px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: var(--size-space-9);
    font-family: var(--font-family-text);
    background: transparent;
  }

  @media (max-width: 1920px) {
    body { display: flex; justify-content: center; }
    .overlay { transform: scale(calc(100vw / 1920)); transform-origin: top left; position: absolute; top: 0; left: 0; }
  }

  /* COMPOSANT: PlaqueClassement */
  .board {
    width: 720px;
    padding: var(--size-space-7);
    border-radius: var(--size-radius-xl);
    border: 2px solid var(--semantic-color-border);
    background: color-mix(in oklch, var(--semantic-color-bg-page) 82%, transparent);
    box-shadow: 0 24px 64px color-mix(in oklch, var(--semantic-color-bg-page) 60%, transparent);
    backdrop-filter: blur(8px);
    animation: board-in var(--motion-duration-reveal) var(--motion-easing-emphasized) both;
  }
  @keyframes board-in {
    from { opacity: 0; transform: translateX(32px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* COMPOSANT: TitreClassement */
  .board__title {
    margin: 0 0 var(--size-space-6);
    display: flex;
    align-items: center;
    gap: var(--size-space-4);
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-black);
    font-size: var(--font-size-step-5);
    color: var(--semantic-color-heading);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .board__title-icon { width: 1em; height: 1em; display: block; color: var(--semantic-color-signature); }

  /* COMPOSANT: ListeRangs */
  .rows { display: flex; flex-direction: column; gap: var(--size-space-3); }

  /* COMPOSANT: LigneRang */
  .row {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: var(--size-space-5);
    padding: var(--size-space-4) var(--size-space-5);
    border-radius: var(--size-radius-md);
    border: 1.5px solid var(--semantic-color-border);
    background: color-mix(in oklch, var(--semantic-color-bg-surface) 55%, transparent);
  }
  .row--leader {
    border-color: color-mix(in oklch, var(--semantic-color-action-primary) 70%, transparent);
    background: color-mix(in oklch, var(--semantic-color-action-primary) 24%, transparent);
    box-shadow: 0 0 40px color-mix(in oklch, var(--semantic-color-signature) 40%, transparent);
  }

  .row__rank {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-black);
    font-size: var(--font-size-step-6);
    line-height: 1;
    color: var(--semantic-color-text-secondary);
    min-width: 1.4ch;
    text-align: center;
    font-variant-numeric: tabular-nums;
  }
  .row--leader .row__rank {
    color: var(--semantic-color-signature);
    text-shadow: 0 0 32px color-mix(in oklch, var(--semantic-color-signature) 60%, transparent);
  }

  .row__name {
    font-size: var(--font-size-step-3);
    font-weight: var(--font-weight-bold);
    color: var(--semantic-color-text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .row__score {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-bold);
    font-size: var(--font-size-step-4);
    color: var(--semantic-color-text-primary);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.01em;
  }
  .row--leader .row__score { color: var(--semantic-color-signature); }
</style>
</head>
<body>
  <!-- COMPOSANT: OverlayLeaderboard -->
  <div class="overlay">
    <!-- COMPOSANT: PlaqueClassement -->
    <div class="board">
      <!-- COMPOSANT: TitreClassement -->
      <h1 class="board__title">
        <svg class="board__title-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
        </svg>
        Top 5
      </h1>

      <!-- COMPOSANT: ListeRangs -->
      <div class="rows">
        <!-- COMPOSANT: LigneRang (1er, surligné) -->
        <div class="row row--leader">
          <span class="row__rank">1</span>
          <span class="row__name">PixelNight</span>
          <span class="row__score">1&nbsp;250</span>
        </div>
        <!-- COMPOSANT: LigneRang -->
        <div class="row">
          <span class="row__rank">2</span>
          <span class="row__name">LunaVibe</span>
          <span class="row__score">1&nbsp;180</span>
        </div>
        <div class="row">
          <span class="row__rank">3</span>
          <span class="row__name">FreeZe</span>
          <span class="row__score">1&nbsp;045</span>
        </div>
        <div class="row">
          <span class="row__rank">4</span>
          <span class="row__name">SkyLynn</span>
          <span class="row__score">930</span>
        </div>
        <div class="row">
          <span class="row__rank">5</span>
          <span class="row__name">DarkShadow</span>
          <span class="row__score">870</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
