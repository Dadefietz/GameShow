<!-- artifact: mockup; app:root; screen:overlay-question; version:1; produced_by:design-builder -->
<!-- A11Y: focus=n/a (overlay display-only, non interactif); contrast=texte crème/plaque sombre color-mix >=4.5:1; aria=n/a display-only; touch=n/a -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay — Question</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  /* FOND TRANSPARENT obligatoire pour OBS */
  html, body { background: transparent; margin: 0; padding: 0; }

  .overlay {
    position: relative;
    width: 1920px;
    height: 1080px;
    box-sizing: border-box;
    display: flex;
    align-items: flex-end;
    padding: var(--size-space-9);
    font-family: var(--font-family-text);
    background: transparent;
    overflow: hidden;
  }

  /* aperçu adaptatif : scale down sans casser le canvas 1920x1080 */
  @media (max-width: 1920px) {
    body { display: flex; justify-content: center; }
    .overlay { transform: scale(calc(100vw / 1920)); transform-origin: top left; position: absolute; top: 0; left: 0; }
  }

  /* COMPOSANT: PlaqueQuestion */
  .plate {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto;
    gap: var(--size-space-8);
    align-items: center;
    padding: var(--size-space-7) var(--size-space-8);
    border-radius: var(--size-radius-xl);
    border: 2px solid var(--semantic-color-border);
    background: color-mix(in oklch, var(--semantic-color-bg-page) 82%, transparent);
    box-shadow: 0 24px 64px color-mix(in oklch, var(--semantic-color-bg-page) 60%, transparent);
    backdrop-filter: blur(8px);
    animation: plate-rise var(--motion-duration-reveal) var(--motion-easing-emphasized) both;
  }
  @keyframes plate-rise {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .plate__body { min-width: 0; }

  /* COMPOSANT: EtiquetteEpreuve */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: var(--size-space-2);
    padding: var(--size-space-2) var(--size-space-4);
    border-radius: var(--size-radius-full);
    background: color-mix(in oklch, var(--semantic-color-action-primary) 22%, transparent);
    border: 1.5px solid color-mix(in oklch, var(--semantic-color-action-primary) 60%, transparent);
    color: var(--semantic-color-signature);
    font-size: var(--font-size-step-1);
    font-weight: var(--font-weight-bold);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tag__icon { width: 1.4em; height: 1.4em; display: block; }

  /* COMPOSANT: TexteQuestion */
  .question {
    margin: var(--size-space-5) 0 0;
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-black);
    font-size: var(--font-size-step-6);
    line-height: var(--font-line-height-tight);
    color: var(--semantic-color-text-primary);
    text-shadow: 0 4px 24px color-mix(in oklch, var(--semantic-color-signature) 35%, transparent);
  }

  /* COMPOSANT: PanneauStats */
  .stats {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--size-space-4);
    padding-left: var(--size-space-8);
    border-left: 2px solid var(--semantic-color-border);
  }

  .count {
    display: flex;
    flex-direction: column;
    align-items: center;
    line-height: 1;
  }
  .count__value {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-black);
    font-size: var(--font-size-display-hero);
    color: var(--semantic-color-signature);
    line-height: 0.9;
    text-shadow: 0 0 40px color-mix(in oklch, var(--semantic-color-signature) 55%, transparent);
    font-variant-numeric: tabular-nums;
  }
  .count__label {
    margin-top: var(--size-space-2);
    font-size: var(--font-size-step-2);
    font-weight: var(--font-weight-semibold);
    color: var(--semantic-color-text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  /* COMPOSANT: Timer */
  .timer {
    display: inline-flex;
    align-items: center;
    gap: var(--size-space-3);
    padding: var(--size-space-3) var(--size-space-5);
    border-radius: var(--size-radius-full);
    background: color-mix(in oklch, var(--semantic-color-heading) 20%, transparent);
    border: 2px solid color-mix(in oklch, var(--semantic-color-heading) 55%, transparent);
    color: var(--semantic-color-heading);
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-bold);
    font-size: var(--font-size-step-4);
    font-variant-numeric: tabular-nums;
  }
  .timer__icon { width: 1em; height: 1em; display: block; }
</style>
</head>
<body>
  <!-- COMPOSANT: OverlayQuestion -->
  <div class="overlay">
    <!-- COMPOSANT: PlaqueQuestion -->
    <div class="plate">
      <div class="plate__body">
        <!-- COMPOSANT: EtiquetteEpreuve -->
        <span class="tag">
          <svg class="tag__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
          Quiz · Épreuve 4/12
        </span>
        <!-- COMPOSANT: TexteQuestion -->
        <h1 class="question">Quelle est la plus haute montagne d'Europe ?</h1>
      </div>

      <!-- COMPOSANT: PanneauStats -->
      <div class="stats">
        <!-- COMPOSANT: NombreReponses -->
        <div class="count">
          <span class="count__value">832</span>
          <span class="count__label">réponses</span>
        </div>
        <!-- COMPOSANT: Timer -->
        <span class="timer">
          <svg class="timer__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2"/><path d="M5 3 2 6"/><path d="m22 6-3-3"/>
          </svg>
          14 s
        </span>
      </div>
    </div>
  </div>
</body>
</html>
