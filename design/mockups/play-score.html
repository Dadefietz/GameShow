<!-- artifact: mockup; app:root; screen:play-score; version:1; produced_by:design-builder -->
<!-- A11Y: focus=ordre logique, anneau 2px action-primary offset 2px; contrast=texte neutral-100/bg-page 16.6:1 AAA; aria=main landmark, boutons libellés; touch=44px min -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Résultat — Project Game Show</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .screen {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background:
      radial-gradient(120% 60% at 50% 0%,
        color-mix(in oklch, var(--semantic-color-signature) 18%, transparent) 0%,
        color-mix(in oklch, var(--semantic-color-action-primary) 7%, transparent) 40%,
        transparent 66%),
      var(--semantic-color-bg-page);
    color: var(--semantic-color-text-primary);
    font-family: var(--font-family-text);
  }
  .screen__main {
    width: 100%;
    max-width: 430px;
    padding: var(--size-space-7) var(--size-space-5) var(--size-space-6);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--size-space-5);
    text-align: center;
  }

  /* COMPOSANT: Confirmation envoi */
  .sent { display: flex; flex-direction: column; align-items: center; gap: var(--size-space-3); }
  .sent__check {
    display: grid;
    place-items: center;
    width: 76px;
    height: 76px;
    border-radius: var(--size-radius-full);
    background: var(--semantic-color-status-success);
    color: var(--semantic-color-action-on-forest);
    box-shadow: 0 8px 34px color-mix(in oklch, var(--semantic-color-status-success) 44%, transparent);
    animation: pop var(--motion-duration-slow) var(--motion-easing-emphasized);
  }
  .sent__check svg { width: 40px; height: 40px; }
  .sent__text {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-semibold);
    font-size: var(--font-size-step-2);
    color: var(--semantic-color-heading);
  }
  @keyframes pop {
    0%   { transform: scale(0.5); opacity: 0; }
    60%  { transform: scale(1.08); }
    100% { transform: scale(1); opacity: 1; }
  }
  /* /COMPOSANT: Confirmation envoi */

  /* COMPOSANT: Rang */
  .rank {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--size-space-1);
  }
  .rank__label {
    font-size: var(--font-size-step--1);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--semantic-color-text-secondary);
  }
  .rank__value {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-black);
    font-size: var(--font-size-display-hero);
    line-height: 0.9;
    color: var(--semantic-color-signature);
    letter-spacing: -0.02em;
  }
  .rank__delta {
    display: inline-flex;
    align-items: center;
    gap: var(--size-space-2);
    padding: var(--size-space-2) var(--size-space-4);
    border-radius: var(--size-radius-full);
    background: color-mix(in oklch, var(--semantic-color-action-secondary) 20%, transparent);
    color: var(--semantic-color-action-secondary);
    font-weight: var(--font-weight-bold);
    font-size: var(--font-size-step-0);
  }
  .rank__delta svg { width: 18px; height: 18px; }
  /* /COMPOSANT: Rang */

  /* COMPOSANT: Score */
  .points {
    display: inline-flex;
    align-items: baseline;
    gap: var(--size-space-2);
  }
  .points__value {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-bold);
    font-size: var(--font-size-step-3);
    color: var(--semantic-color-text-primary);
  }
  .points__unit {
    font-size: var(--font-size-step-0);
    color: var(--semantic-color-text-secondary);
    font-weight: var(--font-weight-semibold);
  }
  /* /COMPOSANT: Score */

  /* COMPOSANT: Mini classement */
  .board {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: var(--size-space-2);
    padding: var(--size-space-4);
    border-radius: var(--size-radius-lg);
    border: 1px solid var(--component-card-border);
    background: var(--component-card-bg);
  }
  .board__title {
    font-size: var(--font-size-step--1);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--semantic-color-heading);
    text-align: left;
    padding: 0 var(--size-space-2) var(--size-space-1);
  }
  .board__row {
    display: flex;
    align-items: center;
    gap: var(--size-space-3);
    min-height: 44px;
    padding: var(--size-space-2) var(--size-space-3);
    border-radius: var(--size-radius-md);
    text-align: left;
  }
  .board__rank {
    flex-shrink: 0;
    width: 40px;
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-bold);
    font-size: var(--font-size-step-0);
    color: var(--semantic-color-text-secondary);
  }
  .board__rank svg { width: 20px; height: 20px; }
  .board__name { flex: 1; font-weight: var(--font-weight-semibold); color: var(--semantic-color-text-primary); }
  .board__pts { flex-shrink: 0; font-variant-numeric: tabular-nums; color: var(--semantic-color-text-secondary); font-size: var(--font-size-step--1); }
  .board__row--gold .board__rank { color: var(--semantic-color-status-warning); }
  .board__row--me {
    background: color-mix(in oklch, var(--semantic-color-signature) 16%, transparent);
    border: 1px solid color-mix(in oklch, var(--semantic-color-signature) 40%, transparent);
  }
  .board__row--me .board__rank,
  .board__row--me .board__name { color: var(--semantic-color-signature); }
  /* /COMPOSANT: Mini classement */

  /* COMPOSANT: Prochaine épreuve */
  .next {
    display: inline-flex;
    align-items: center;
    gap: var(--size-space-2);
    font-size: var(--font-size-step-0);
    color: var(--semantic-color-text-secondary);
  }
  .next svg { width: 17px; height: 17px; color: var(--semantic-color-action-primary); }
  .next__count { font-weight: var(--font-weight-bold); color: var(--semantic-color-text-primary); }
  /* /COMPOSANT: Prochaine épreuve */
</style>
</head>
<body>
<main class="screen" aria-labelledby="sent-text">
  <div class="screen__main">

    <!-- COMPOSANT: Confirmation envoi -->
    <div class="sent">
      <span class="sent__check" aria-hidden="true">
        <!-- Lucide: check -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </span>
      <h1 class="sent__text" id="sent-text">Réponse envoyée !</h1>
    </div>
    <!-- /COMPOSANT: Confirmation envoi -->

    <!-- COMPOSANT: Rang -->
    <div class="rank">
      <span class="rank__label">Ton rang</span>
      <span class="rank__value">112<sup>e</sup></span>
      <span class="rank__delta">
        <!-- Lucide: arrow-up -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>
        </svg>
        +43 places
      </span>
    </div>
    <!-- /COMPOSANT: Rang -->

    <!-- COMPOSANT: Score -->
    <p class="points">
      <span class="points__value">1 250</span>
      <span class="points__unit">pts</span>
    </p>
    <!-- /COMPOSANT: Score -->

    <!-- COMPOSANT: Mini classement -->
    <section class="board" aria-label="Classement">
      <h2 class="board__title">Autour du feu</h2>
      <div class="board__row board__row--gold">
        <span class="board__rank" aria-label="1re place">
          <!-- Lucide: trophy -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/>
          </svg>
        </span>
        <span class="board__name">EmberFox</span>
        <span class="board__pts">4 980 pts</span>
      </div>
      <div class="board__row">
        <span class="board__rank">2.</span>
        <span class="board__name">NovaLynx</span>
        <span class="board__pts">4 610 pts</span>
      </div>
      <div class="board__row">
        <span class="board__rank">3.</span>
        <span class="board__name">AshRiver</span>
        <span class="board__pts">4 355 pts</span>
      </div>
      <div class="board__row board__row--me">
        <span class="board__rank">112.</span>
        <span class="board__name">Toi</span>
        <span class="board__pts">1 250 pts</span>
      </div>
    </section>
    <!-- /COMPOSANT: Mini classement -->

    <!-- COMPOSANT: Prochaine épreuve -->
    <p class="next" role="status" aria-live="polite">
      <!-- Lucide: hourglass -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>
      </svg>
      Prochaine épreuve dans <span class="next__count">10 s</span>
    </p>
    <!-- /COMPOSANT: Prochaine épreuve -->

  </div>
</main>
</body>
</html>
