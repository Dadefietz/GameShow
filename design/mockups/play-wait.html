<!-- artifact: mockup; app:root; screen:play-wait; version:1; produced_by:design-builder -->
<!-- A11Y: focus=ordre logique, anneau 2px action-primary offset 2px; contrast=texte neutral-100/bg-page 16.6:1 AAA; aria=main landmark, boutons libellés; touch=44px min -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salle d'attente — Project Game Show</title>
<link rel="stylesheet" href="../tokens/tokens.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .screen {
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    background:
      radial-gradient(130% 70% at 50% 108%,
        color-mix(in oklch, var(--semantic-color-signature) 24%, transparent) 0%,
        color-mix(in oklch, var(--semantic-color-action-primary) 9%, transparent) 40%,
        transparent 68%),
      var(--semantic-color-bg-page);
    color: var(--semantic-color-text-primary);
    font-family: var(--font-family-text);
  }
  .screen__main {
    width: 100%;
    max-width: 430px;
    padding: var(--size-space-7) var(--size-space-5);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--size-space-6);
    text-align: center;
  }

  /* COMPOSANT: Identité joueur */
  .player {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--size-space-3);
  }
  .player__badge {
    display: inline-flex;
    align-items: center;
    gap: var(--size-space-2);
    padding: var(--size-space-2) var(--size-space-4);
    border-radius: var(--size-radius-full);
    border: 1px solid var(--component-card-border);
    background: color-mix(in oklch, var(--semantic-color-bg-surface) 80%, transparent);
    font-size: var(--font-size-step--1);
    color: var(--semantic-color-text-secondary);
  }
  .player__badge svg { width: 15px; height: 15px; color: var(--semantic-color-action-secondary); }
  .player__name {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-black);
    font-size: var(--font-size-step-5);
    line-height: var(--font-line-height-tight);
    color: var(--semantic-color-signature);
    letter-spacing: -0.01em;
  }
  /* /COMPOSANT: Identité joueur */

  /* COMPOSANT: Feu d'attente */
  .fire {
    position: relative;
    display: grid;
    place-items: center;
    width: 140px;
    height: 140px;
    border-radius: var(--size-radius-full);
    color: var(--semantic-color-signature);
    background:
      radial-gradient(circle at 50% 62%,
        color-mix(in oklch, var(--semantic-color-signature) 38%, transparent) 0%,
        color-mix(in oklch, var(--semantic-color-action-primary) 16%, transparent) 52%,
        transparent 74%);
  }
  .fire::before {
    content: "";
    position: absolute;
    inset: -18px;
    border-radius: var(--size-radius-full);
    border: 1px solid color-mix(in oklch, var(--semantic-color-signature) 30%, transparent);
    animation: pulse-ring 2.8s var(--motion-easing-decelerate) infinite;
  }
  .fire svg { width: 62px; height: 62px; animation: sway 2.6s var(--motion-easing-standard) infinite; }
  @keyframes pulse-ring {
    0%   { transform: scale(0.9); opacity: 0.9; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  @keyframes sway {
    0%, 100% { transform: rotate(-3deg) scale(1); }
    50%      { transform: rotate(3deg) scale(1.06); }
  }
  /* /COMPOSANT: Feu d'attente */

  /* COMPOSANT: État d'attente */
  .status { display: flex; flex-direction: column; align-items: center; gap: var(--size-space-2); }
  .status__text {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-semibold);
    font-size: var(--font-size-step-2);
    color: var(--semantic-color-heading);
    line-height: var(--font-line-height-snug);
  }
  .status__dots { display: inline-flex; gap: 6px; margin-top: var(--size-space-1); }
  .status__dot {
    width: 9px; height: 9px;
    border-radius: var(--size-radius-full);
    background: var(--semantic-color-action-primary);
    animation: bounce 1.2s var(--motion-easing-standard) infinite;
  }
  .status__dot--2 { animation-delay: 0.16s; }
  .status__dot--3 { animation-delay: 0.32s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40%           { transform: translateY(-7px); opacity: 1; }
  }
  /* /COMPOSANT: État d'attente */

  /* COMPOSANT: Compteur joueurs */
  .counter {
    display: flex;
    align-items: center;
    gap: var(--size-space-3);
    padding: var(--size-space-4) var(--size-space-5);
    border-radius: var(--size-radius-lg);
    border: 1px solid var(--component-card-border);
    background: var(--component-card-bg);
    width: 100%;
    justify-content: center;
  }
  .counter svg { width: 26px; height: 26px; color: var(--semantic-color-action-secondary); }
  .counter__value {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-black);
    font-size: var(--font-size-step-3);
    color: var(--semantic-color-text-primary);
    line-height: 1;
  }
  .counter__label {
    font-size: var(--font-size-step--1);
    color: var(--semantic-color-text-secondary);
  }
  /* /COMPOSANT: Compteur joueurs */

  /* COMPOSANT: Rappel code */
  .roomcode {
    display: inline-flex;
    align-items: center;
    gap: var(--size-space-2);
    font-size: var(--font-size-step--1);
    color: var(--semantic-color-text-secondary);
  }
  .roomcode svg { width: 15px; height: 15px; }
  .roomcode__value {
    font-family: var(--font-family-display);
    font-weight: var(--font-weight-bold);
    letter-spacing: 0.2em;
    color: var(--semantic-color-text-primary);
  }
  /* /COMPOSANT: Rappel code */
</style>
</head>
<body>
<main class="screen" aria-labelledby="wait-name">
  <div class="screen__main">

    <!-- COMPOSANT: Identité joueur -->
    <div class="player">
      <span class="player__badge">
        <!-- Lucide: check-circle -->
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21.801 10A10 10 0 1 1 17 3.335"/><path d="m9 11 3 3L22 4"/>
        </svg>
        Tu es connecté
      </span>
      <p class="player__name" id="wait-name">PixelNight</p>
    </div>
    <!-- /COMPOSANT: Identité joueur -->

    <!-- COMPOSANT: Feu d'attente -->
    <div class="fire" aria-hidden="true">
      <!-- Lucide: flame -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
      </svg>
    </div>
    <!-- /COMPOSANT: Feu d'attente -->

    <!-- COMPOSANT: État d'attente -->
    <div class="status" role="status" aria-live="polite">
      <p class="status__text">En attente du lancement</p>
      <span class="status__dots" aria-hidden="true">
        <span class="status__dot"></span>
        <span class="status__dot status__dot--2"></span>
        <span class="status__dot status__dot--3"></span>
      </span>
    </div>
    <!-- /COMPOSANT: État d'attente -->

    <!-- COMPOSANT: Compteur joueurs -->
    <div class="counter">
      <!-- Lucide: users -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
      </svg>
      <span class="counter__value">873</span>
      <span class="counter__label">joueurs prêts</span>
    </div>
    <!-- /COMPOSANT: Compteur joueurs -->

    <!-- COMPOSANT: Rappel code -->
    <p class="roomcode">
      <!-- Lucide: hash -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/>
      </svg>
      Salon <span class="roomcode__value">4729</span>
    </p>
    <!-- /COMPOSANT: Rappel code -->

  </div>
</main>
</body>
</html>
