# ─────────────────────────────────────────────
# 3. PERSONAS UTILISATEURS
# ─────────────────────────────────────────────

personas:
  primary:
    name: "Théo — le streamer-animateur"
    description: "Streamer (Twitch/Kick/YouTube) avec une communauté moyenne à grande, qui aime créer des moments forts et parler directement à son audience."
    job_to_be_done: "Transformer son stream en émission interactive où toute sa communauté joue en direct, sans dépendre d'un jeu tiers et sans setup lourd."
    context: "En live, seul aux commandes derrière OBS. Doit garder le rythme et le show tout en pilotant la partie d'une main."
    frustrations:
      - "Les outils d'engagement webinaire ne sont pas stream-natifs et sont payants avec peu de personnalisation."
      - "Les jeux party plafonnent à ~10 joueurs actifs — sa communauté est trop grande pour ça."
      - "Les jeux 'chat' se limitent aux commandes de chat et à Twitch uniquement."
      - "Le setup technique et la modération sont souvent complexes."
    goals:
      - "Faire participer un maximum de viewers, pas seulement les regarder."
      - "Créer des moments mémorables et du suspense qu'il révèle au bon moment."
      - "Garder le contrôle total du rythme (lancer, mettre en pause, révéler, terminer)."
      - "Zéro friction pour ses viewers et une rejouabilité infinie via des modules variés."

  secondary:
    name: "Léa — la viewer-joueuse (mobile)"
    description: "Spectatrice du stream qui regarde sur un écran et veut participer depuis son téléphone."
    job_to_be_done: "Rejoindre une partie en moins de 10 secondes et jouer sans rien installer."
    context: "Le stream tourne sur un écran (TV/PC) ; son téléphone devient la manette. Peut arriver après le début."
    frustrations:
      - "Devoir créer un compte ou installer une application pour jouer."
      - "Arriver en cours de partie et ne pas pouvoir rejoindre."
      - "Interfaces lentes ou confuses qui cassent le plaisir en direct."
    goals:
      - "Rejoindre instantanément via un code ou un QR code."
      - "Comprendre l'écran sans explication et répondre vite."
      - "Voir son score, sa progression et son classement, et rester impliquée même sans gagner."

# ─────────────────────────────────────────────
# 4. BESOINS (MoSCoW)
# ─────────────────────────────────────────────

requirements:
  must:
    - id: M1
      text: "L'animateur peut créer un salon avec un code unique et un QR code."
      rationale: "Sans salon partageable, aucun viewer ne peut rejoindre — c'est le point d'entrée du jeu."
      source: "Spec fonctionnelle §6 + convention marché (Kahoot PIN, Jackbox room code)"
    - id: M2
      text: "Le joueur peut rejoindre via code ou QR, saisir un pseudo, et jouer sans compte ni installation en moins de 10 secondes."
      rationale: "L'accessibilité instantanée est la proposition de valeur centrale ; l'obligation de compte est la frustration n°1 des joueurs."
      source: "Spec §4 (Accessibilité) + gap concurrent (Kahoot/Jackbox join)"
    - id: M3
      text: "Le joueur peut rejoindre une partie déjà commencée."
      rationale: "Les viewers arrivent en continu pendant un live ; interdire le join en cours exclut une grande partie de l'audience."
      source: "Spec §2 (viewers) + comportement réel des streams"
    - id: M4
      text: "L'animateur peut lancer les modules librement, dans l'ordre qu'il veut, et enchaîner sans durée imposée."
      rationale: "Le format 'game-show' libre est la différence structurelle avec un simple quiz linéaire."
      source: "Spec §1, §7"
    - id: M5
      text: "Le joueur peut jouer aux 4 modules de lancement : Quiz (QCM), Vrai/Faux, Estimation (numérique), Vote/Sondage."
      rationale: "Ce sont les modules choisis comme indispensables pour la première version publique ; ils couvrent 4 mécaniques distinctes."
      source: "Décision utilisateur directe (intake) + Spec §9"
    - id: M6
      text: "Le système attribue des points par module et recalcule le classement après chaque module."
      rationale: "Sans score ni classement, il n'y a ni compétition ni raison de rester impliqué."
      source: "Spec §11, §12"
    - id: M7
      text: "L'animateur peut afficher/masquer les réponses, mettre en pause, passer au module suivant et terminer la partie."
      rationale: "Le contrôle total du déroulé par l'animateur est au cœur du produit (piloter le show en direct)."
      source: "Spec §3 (Animateur), §13"
    - id: M8
      text: "L'animateur peut afficher des overlays OBS (question, chronomètre, classement/podium, résultats) comme sources navigateur."
      rationale: "Le spectacle vit sur le stream ; sans overlays OBS, le jeu reste invisible pour l'audience."
      source: "Spec §15 + gap concurrent (aucun rival OBS-first)"
    - id: M9
      text: "Le système pousse les réponses et mises à jour en temps réel aux joueurs et aux overlays."
      rationale: "Un jeu en direct sans temps réel n'a pas de tension ni de synchronisation avec le stream."
      source: "Spec §17"
    - id: M10
      text: "L'animateur dispose d'un dashboard : nombre de joueurs, épreuve en cours, temps restant, classement live, boutons de contrôle."
      rationale: "C'est le poste de pilotage unique de l'animateur pendant le live."
      source: "Spec §13 + maquette infographie"
    - id: M11
      text: "Le joueur dispose d'une interface mobile minimaliste : question, réponse, chronomètre, score, classement."
      rationale: "Le téléphone doit être une manette simple ; toute complexité casse l'expérience en direct."
      source: "Spec §14 (Simplicité) + maquette infographie"

  should:
    - id: S1
      text: "L'animateur peut déclencher des événements spéciaux (Double Points, Mort Subite, Bonus, etc.) pendant la partie."
      rationale: "Les événements créent les rebondissements et le suspense qui distinguent une émission d'un quiz plat ; visés dès la v1 'complète'."
      source: "Spec §10 + maquette infographie"
    - id: S2
      text: "L'animateur peut ajouter des bonus et retirer des points manuellement."
      rationale: "Donne à l'animateur la latitude d'arbitrer et d'animer en direct."
      source: "Spec §3 (Animateur)"
    - id: S3
      text: "L'animateur peut relancer une manche."
      rationale: "Permet de récupérer un bug réseau ou une manche ratée sans casser la partie."
      source: "Spec §3 (Animateur)"
    - id: S4
      text: "Le joueur peut jouer à des modules additionnels (Blind Test, Image Mystère, Rapidité, Mémoire, Classement/ordre, Texte libre)."
      rationale: "La variété alimente la rejouabilité, faiblesse majeure des concurrents 'chat'."
      source: "Spec §9 + Steam Community (manque de variété)"
    - id: S5
      text: "Le joueur est reconnecté automatiquement en cas de perte réseau."
      rationale: "Sur mobile en live, les micro-coupures sont fréquentes ; sans reconnexion, le joueur est éjecté de la partie."
      source: "Spec §17"
    - id: S6
      text: "L'animateur peut choisir ce qu'il affiche du classement (Top 10, Podium, Top 50, position perso, évolution)."
      rationale: "Adapte la dramaturgie du reveal au moment du show."
      source: "Spec §12"
    - id: S7
      text: "Le salon expose des états explicites (En attente, En jeu, Pause, Résultats, Terminé)."
      rationale: "Clarifie l'expérience joueur et le pilotage animateur à chaque instant."
      source: "Spec §6"
    - id: S8
      text: "L'animateur peut consulter un historique/journal des manches jouées."
      rationale: "Aide à animer (rappeler les scores, les temps forts) et à débriefer."
      source: "Spec §13"
    - id: S9
      text: "La plateforme tient de gros pics de joueurs et vise une montée en charge vers ~1000 simultanés."
      rationale: "L'échelle massive est un différenciateur clé, mais traitée comme objectif progressif (seuil de départ à définir en tech-spec)."
      source: "Spec §17 + décision utilisateur (échelle progressive)"

  could:
    - id: C1
      text: "L'animateur peut jouer des modules 'signature' originaux (Le Menteur, Le Saboteur, Le Banquier, Puzzle collaboratif, Emoji/deviner une phrase)."
      rationale: "Ces jeux originaux deviendront la signature du projet, mais viennent après le socle."
      source: "Spec §9 (Modules originaux)"
    - id: C2
      text: "L'animateur peut personnaliser les thèmes et l'habillage visuel des modules."
      rationale: "Personnalisation demandée par les utilisateurs d'outils concurrents, mais non bloquante."
      source: "Capterra StreamAlive (demande de personnalisation)"
    - id: C3
      text: "L'animateur peut activer des intégrations Twitch optionnelles (pseudo Twitch, récompenses de chaîne, commandes chat, events subs/raids)."
      rationale: "Bonus d'immersion ; explicitement optionnel et postérieur dans la spec."
      source: "Spec §16"
    - id: C4
      text: "L'animateur peut crowdsourcer des questions proposées par le chat."
      rationale: "Feature appréciée (itch.io) qui augmente l'implication, mais secondaire."
      source: "itch.io devlog (Streamers Interactive Quiz Game)"
    - id: C5
      text: "L'administrateur peut consulter des statistiques d'usage et gérer les modules/utilisateurs."
      rationale: "Utile pour faire évoluer la plateforme, pas nécessaire pour jouer."
      source: "Spec §3 (Administrateur)"
    - id: C6
      text: "Le jeu propose des sons et animations de plateau avancés (transitions, jingles)."
      rationale: "Renforce le feeling 'game-show TV' mais peut arriver par itérations."
      source: "Spec §8, §15 + feeling design"

  wont:
    - id: W1
      text: "Application mobile native (iOS/Android)."
      rationale: "Le web responsive suffit et respecte le principe 'zéro installation' ; une app native contredit la proposition de valeur."
      source: "Spec §4 + décision produit"
    - id: W2
      text: "Comptes joueurs et persistance de profil/score entre parties."
      rationale: "L'anonymat éphémère (pseudo seul) est un choix produit qui garantit le join <10s et allège le RGPD."
      source: "Spec §4 + décision produit"
    - id: W3
      text: "Multi-animateurs et multi-salons simultanés."
      rationale: "La v1 est un outil personnel mono-animateur/mono-salon ; le SaaS multi-streamers est hors périmètre pour l'instant."
      source: "Décision utilisateur (périmètre perso)"
    - id: W4
      text: "Dépendance obligatoire à Twitch (ou toute plateforme unique)."
      rationale: "Le jeu doit fonctionner indépendamment de Twitch ; les intégrations restent optionnelles."
      source: "Spec §16"
    - id: W5
      text: "Classement mondial persistant et système de modération lourd."
      rationale: "Hors scope : le jeu est éphémère par partie ; la modération se limite au filtrage de pseudo."
      source: "Décision produit"

# ─────────────────────────────────────────────
# 5. FLUX UTILISATEURS PRINCIPAUX
# ─────────────────────────────────────────────

user_flows:
  - id: F1
    name: "Animer une partie (parcours animateur)"
    actor: "Théo — animateur"
    trigger: "Théo veut lancer un jeu-show pendant son stream."
    steps:
      - "Se connecte et crée un salon."
      - "Affiche le code et le QR code à l'écran (overlay OBS)."
      - "Attend que les joueurs rejoignent (salle d'attente)."
      - "Lance la partie puis choisit un premier module."
      - "Anime : lance le chrono, met en pause, déclenche un événement, affiche/masque les réponses."
      - "Révèle les résultats et le classement au bon moment."
      - "Enchaîne un nouveau module, autant de fois qu'il veut."
      - "Termine la partie sur un podium final."
    outcome: "Une émission interactive complète animée en direct, du salon au podium, sans dépendre d'un jeu tiers."

  - id: F2
    name: "Rejoindre et jouer (parcours joueur)"
    actor: "Léa — viewer-joueuse"
    trigger: "Léa voit le code/QR à l'écran du stream et veut jouer."
    steps:
      - "Scanne le QR code (ou saisit le code) depuis son téléphone."
      - "Entre un pseudo, sans compte."
      - "Arrive en salle d'attente puis participe au module en cours."
      - "Répond dans le temps imparti et voit sa réponse confirmée."
      - "Voit son score, sa progression et son classement."
      - "Enchaîne les manches suivantes jusqu'à la fin."
    outcome: "Léa a joué toute l'émission depuis son téléphone en moins de 10 secondes d'onboarding."

  - id: F3
    name: "Rejoindre une partie déjà commencée"
    actor: "Léa (retardataire)"
    trigger: "Léa arrive sur le stream après le début de la partie."
    steps:
      - "Scanne le QR / saisit le code pendant qu'un module est en cours."
      - "Entre un pseudo et est intégrée à la partie en cours."
      - "Participe dès le prochain module (ou immédiatement si le module l'autorise)."
    outcome: "Aucun viewer n'est exclu à cause de son heure d'arrivée."

