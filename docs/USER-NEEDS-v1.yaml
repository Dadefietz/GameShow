# ─────────────────────────────────────────────
# 7. CONTRAINTES
# ─────────────────────────────────────────────

constraints:
  target_platform:
    - "web"        # responsive : joueur sur mobile, animateur sur desktop, overlays comme sources navigateur OBS
  budget_range: "Bootstrap / projet personnel"
  timeline: "Pas de deadline stricte ; viser une v1 'complète' (4 modules + événements + overlays OBS + dashboard)."
  legal_compliance:
    - "RGPD léger : pseudo uniquement, aucun compte, données éphémères par partie ; mentions légales minimales."
    - "Filtrage/modération des pseudos (anti-contenu offensant)."
  technical_constraints:
    - "Temps réel bidirectionnel (WebSockets) entre animateur, joueurs et overlays."
    - "Overlays exploitables comme sources navigateur dans OBS."
    - "Reconnexion réseau automatique côté mobile."
    - "Indépendance vis-à-vis de Twitch (fonctionne sur Twitch/Kick/YouTube)."
  non_goals:
    - "Comptes joueurs et persistance de profil."
    - "Application mobile native."
    - "Multi-animateurs / multi-salons simultanés (v1)."

