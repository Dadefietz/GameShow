# 8. MVP SCOPE
# ─────────────────────────────────────────────

mvp:
  hypothesis: "Un jeu-show stream-natif où chaque viewer joue depuis son téléphone sans compte génère un engagement massif et des moments mémorables qu'aucun outil existant ne permet."
  scope:
    - "M1"
    - "M2"
    - "M3"
    - "M4"
    - "M5"
    - "M6"
    - "M7"
    - "M8"
    - "M9"
    - "M10"
    - "M11"
  out_of_scope: []   # Tous les Must sont dans le MVP. Cible v1 'complète' inclut aussi S1 (événements) et S2 (bonus/malus).
  success_metric: "Sur un vrai stream : un fort taux de participation (joueurs actifs / viewers présents), des parties enchaînées sans friction ni décrochage, et un onboarding joueur mesuré < 10 s. Signal qualitatif : les viewers décrivent un 'moment mémorable' et reviennent."

# ─────────────────────────────────────────────
# 9. LOG DE DÉCISIONS
# ─────────────────────────────────────────────

decision_log:
  - date: "2026-07-22"
    decision: "Périmètre v1 = outil personnel mono-animateur / mono-salon."
    rationale: "Correspond à la spec v1 et réduit fortement la complexité (pas de comptes, pas d'isolation multi-tenant)."
    alternatives_rejected: "Plateforme SaaS multi-streamers dès le départ (reportée en Won't W3)."
  - date: "2026-07-22"
    decision: "4 modules de lancement : Quiz (QCM), Vrai/Faux, Estimation, Vote."
    rationale: "Choisis par l'utilisateur comme indispensables ; couvrent 4 mécaniques distinctes (choix, binaire, numérique, opinion)."
    alternatives_rejected: "Démarrer avec un seul module (trop maigre pour un 'game-show') ; démarrer avec les 15 modules (trop lourd)."
  - date: "2026-07-22"
    decision: "1000 joueurs simultanés = objectif progressif (Should S9), pas un Must de v1."
    rationale: "L'utilisateur a laissé l'architecte fixer un seuil de départ raisonnable ; permet de livrer plus vite sans surdimensionner l'infra."
    alternatives_rejected: "1000 simultanés dès la v1 comme Must (surcoût technique injustifié au démarrage)."
  - date: "2026-07-22"
    decision: "Direction design = game-show TV spectaculaire."
    rationale: "Choix utilisateur ; aligne avec l'infographie et différencie du rendu webinaire des concurrents."
    alternatives_rejected: "Arcade rétro, minimaliste SaaS, cartoon party-game."
  - date: "2026-07-22"
    decision: "Indépendance Twitch ; intégrations plateformes en Could (C3)."
    rationale: "Le jeu doit marcher sur Twitch/Kick/YouTube ; les intégrations natives sont un bonus optionnel."
    alternatives_rejected: "Couplage fort à Twitch (réduirait le marché et contredit la spec §16)."
