    insight: "Les animateurs valorisent l'interaction temps réel à faible friction mais veulent un prix plus bas ET plus de personnalisation des éléments interactifs."
  - subreddit: "Steam Community (Marbles on Stream) — substitut Reddit"
    url: "https://steamcommunity.com/app/1170970/discussions/0/4516632983095949848"
    insight: "Les joueurs se plaignent de synchro cross-plateforme défaillante, d'un manque de variété et d'un support difficile d'accès (Discord uniquement)."
