# ─────────────────────────────────────────────
# 1. CONTEXTE PROJET
# ─────────────────────────────────────────────

project_name: "Project Game Show"
tagline: "La plateforme d'animation où le streamer présente un vrai jeu télévisé et toute sa communauté joue depuis son téléphone."

problem_statement: |
  Les streamers (Twitch, Kick, YouTube) veulent transformer leur audience passive en
  participants actifs, mais aucun outil existant ne le permet vraiment sans compromis.
  Les outils d'engagement type webinaire (StreamAlive, Slido) ne sont pas pensés pour le
  stream et coûtent cher avec peu de personnalisation. Les jeux party (Jackbox, Kahoot)
  plafonnent le nombre de joueurs (Jackbox 3-10 actifs ; Kahoot gratuit 10) et ne
  s'intègrent pas nativement à OBS. Les jeux "chat" (Marbles, Kukoro) limitent la
  participation à des commandes de chat Twitch et souvent au simple vote, donc mono-plateforme.
  Il manque une plateforme stream-native, multi-plateforme, où le téléphone devient une
  manette pour CHAQUE viewer, sans compte, à grande échelle, sous forme d'un jeu-show
  modulaire entièrement piloté par l'animateur et diffusé via des overlays OBS.

# ─────────────────────────────────────────────
# 2. BENCHMARK MARCHÉ
# ─────────────────────────────────────────────

market:
  size_indicator: "Catégorie 'audience engagement' active mais fragmentée : StreamAlive noté 4.8/5 sur 16 avis vérifiés (source: https://www.capterra.com/p/10010918/StreamAlive/reviews/) ; Kahoot monte à 2 000-10 000 participants sur plans payants (source: https://support.kahoot.com/hc/en-us/articles/115003072287-How-many-participants-can-play-a-kahoot) ; Marbles on Stream jusqu'à ~900 joueurs (source: https://www.boardgamefightclub.com/articles/Every-Twitch-Chat-Integrated-Video-Game/)."
  trend: "Créneau émergent : le jeu-avec-l'audience est décrit comme 'still a new concept with limited game availability' (source: https://www.boardgamefightclub.com/articles/Every-Twitch-Chat-Integrated-Video-Game/). Forte demande d'interactivité côté streamers."
  opportunity: "Jeu-show stream-natif + multi-plateforme + téléphone-manette pour tous + sans compte + grande échelle + modulaire + overlays OBS : cette combinaison n'est couverte par aucun acteur."

competitors:
  - name: "StreamAlive (et Slido)"
    url: "https://www.streamalive.com/"
    value_proposition: "Engagement d'audience en direct (sondages, quiz, nuages de mots) via le chat existant."
    strengths:
      - text: "Interaction temps réel qui 'a fait passer mes webinaires au niveau supérieur' ; participation à faible friction via le chat déjà utilisé."
        source_url: "https://www.capterra.com/p/10010918/StreamAlive/reviews/"
      - text: "Jugé intuitif et facile à prendre en main."
        source_url: "https://www.capterra.com/p/10010918/StreamAlive/reviews/"
    weaknesses:
      - text: "Les utilisateurs réclament 'une option moins chère ou à plus petit palier'."
        source_url: "https://www.capterra.com/p/10010918/StreamAlive/reviews/"
      - text: "Personnalisation limitée des éléments interactifs ; pensé pour Zoom/Meet/Teams, pas pour le stream (OBS)."
        source_url: "https://www.capterra.com/p/10010918/StreamAlive/reviews/"
    pricing: "~20 $/mois (mentionné en réponse éditeur ; pas de palier plus bas)"

  - name: "Jackbox Party Pack"
    url: "https://www.jackboxgames.com/"
    value_proposition: "Jeux de soirée où l'on rejoint depuis son téléphone via jackbox.tv."
    strengths:
      - text: "Rejoindre depuis le téléphone sans app dédiée ; jeux polis et fun."
        source_url: "https://support.jackboxgames.com/hc/en-us/articles/15794756085015-How-many-players-can-join-each-game"
    weaknesses:
      - text: "Plafond de 3 à 10 joueurs actifs par jeu (Lie Swatter exceptionnellement 100) ; l'audience ne fait que 'suivre'."
        source_url: "https://support.jackboxgames.com/hc/en-us/articles/15794756085015-How-many-players-can-join-each-game"
      - text: "Achat Steam, pas d'overlays OBS natifs, pas de format 'game-show' modulaire enchaînable, pas de contrôle fin de l'animateur."
        source_url: "https://support.jackboxgames.com/hc/en-us/articles/15794756085015-How-many-players-can-join-each-game"
    pricing: "Achat unique par pack (Steam)"

  - name: "Kahoot"
    url: "https://kahoot.com/"
    value_proposition: "Quiz interactif rejoint par un PIN, orienté éducation/entreprise."
    strengths:
      - text: "Rejoindre instantanément par un code ; capable de grande échelle (2 000-10 000) sur plans payants."
        source_url: "https://support.kahoot.com/hc/en-us/articles/115003072287-How-many-participants-can-play-a-kahoot"
    weaknesses:
      - text: "Gratuit plafonné à 10 participants ; l'échelle exige un abonnement payant coûteux."
        source_url: "https://support.kahoot.com/hc/en-us/articles/115003072287-How-many-participants-can-play-a-kahoot"
      - text: "Orienté salle de classe / webinaire, pas stream-natif, pas d'overlays OBS, un seul type de jeu (quiz)."
        source_url: "https://support.kahoot.com/hc/en-us/articles/115003072287-How-many-participants-can-play-a-kahoot"
    pricing: "Gratuit (10 joueurs) → plans payants pour l'échelle"

  - name: "Marbles on Stream / jeux 'chat' (Kukoro, Mega Quiz)"
    url: "https://store.steampowered.com/app/1170970/Marbles_On_Stream/"
    value_proposition: "Jeux stream-natifs où l'audience participe via des commandes de chat."
    strengths:
      - text: "Grande échelle (jusqu'à ~900 joueurs) et vraie intégration au stream."
        source_url: "https://www.boardgamefightclub.com/articles/Every-Twitch-Chat-Integrated-Video-Game/"
    weaknesses:
      - text: "Participation limitée aux commandes de chat et souvent au vote, pas au contrôle individuel ; mono-plateforme (Twitch)."
        source_url: "https://www.boardgamefightclub.com/articles/Every-Twitch-Chat-Integrated-Video-Game/"
      - text: "Utilisateurs frustrés par des bugs de synchro cross-plateforme et un manque de variété ; support seulement via Discord."
        source_url: "https://steamcommunity.com/app/1170970/discussions/0/4516632983095949848"
    pricing: "Achat Steam"

