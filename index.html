<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Project Game Show</title>
  <meta name="description" content="Jeu télévisé interactif en livestream — l'animateur présente, la communauté joue depuis son téléphone." />
  <meta property="og:title" content="Project Game Show — Rejoins la partie" />
  <meta property="og:image" content="/assets/social-card-join.png" />
  <!-- ICÔNE D'ONGLET — état FIXE de la marque. Le dessin est DÉRIVÉ de
       src/client/shared/marque-flamme.js : un contrôle automatique compare les
       deux et rougit s'ils divergent, ce qui est exactement ce qui s'était
       produit sans que personne ne le voie (chantier v2, décision 5.1).
       Les couleurs y sont figées : une icône d'onglet est un document isolé,
       elle ne lit ni la feuille de style ni les jetons. Contrainte du support,
       pas entorse à la convention. -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5.25' fill='%23332114'/%3E%3Cg stroke='%23f59a3c' stroke-width='2.1' stroke-linecap='round' fill='none'%3E%3Cpath d='M12 2.9c3 3.7 4.5 6.1 4.5 8a4.5 4.5 0 01-9 0c0-1.7.9-3.4 2.6-5.2'/%3E%3Cpath d='M3.4 18.7l17.2-3.5'/%3E%3Cpath d='M3.4 15.2l17.2 3.5'/%3E%3C/g%3E%3Ccircle cx='12' cy='12.6' r='1.5' fill='%23f59a3c'/%3E%3C/svg%3E" />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/inter-600-latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-600-latin.woff2" crossorigin />
  <link rel="preload" as="font" type="font/woff2" href="/fonts/fraunces-900-latin.woff2" crossorigin />
  <!-- Design system (tokens + polices self-hostées) bundlé par Vite via l'import dans main.jsx (aucun CDN) -->
  <!-- CSS critique EN DUR (avant tout bundle) : supprime le flash blanc au chargement. -->
  <style>
    /* Ces deux valeurs sont CELLES DU JETON --c-canvas, recopiées : cette feuille
       est en ligne dans le document, servie avant tout bundle, elle ne peut pas lire
       les jetons. Elles valaient oklch(0.200 0.008 80) — un brun NEUTRE, quand le
       jeton est un brun CHAUD : chaque chargement virait de l'un à l'autre.
       Un contrôle automatique compare désormais les deux. */
    html, body { margin: 0; height: 100%; background-color: oklch(0.198 0.024 55); }
    #root { min-height: 100%; }
    .boot {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background-color: oklch(0.198 0.024 55); color: #f4ede2;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .boot__emblem {
      width: 76px; height: 76px;
      animation: boot-pulse 1.6s ease-in-out infinite;
    }
    .boot__name { font-size: 20px; font-weight: 700; letter-spacing: 0.02em; }
    .boot__dots { display: flex; gap: 7px; }
    .boot__dot { width: 8px; height: 8px; border-radius: 999px; background: #ffb05c; opacity: 0.4; animation: boot-dot 1.2s ease-in-out infinite; }
    .boot__dot:nth-child(2) { animation-delay: 0.18s; }
    .boot__dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes boot-pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.06); opacity: 0.85; } }
    @keyframes boot-dot { 0%,100% { opacity: 0.35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
    @media (prefers-reduced-motion: reduce) { .boot__emblem, .boot__dot { animation: none; } }
  </style>
</head>
<body>
  <div id="root">
    <div class="boot" role="status" aria-label="Chargement de Project Game Show">
      <!-- LA FLAMME, et non plus l'emblème du tipi (décision 5.4). Ce PNG était
           une TROISIÈME marque, montrée en premier à chaque chargement : l'identité
           changeait en cours de route, puis changeait encore quand React prenait la
           main. Ce tracé est celui de marque-flamme.js, et le contrôle le vérifie. -->
      <svg class="boot__emblem" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <g stroke="#f59a3c" stroke-width="2.1" stroke-linecap="round">
          <path d="M12 2.9c3 3.7 4.5 6.1 4.5 8a4.5 4.5 0 01-9 0c0-1.7.9-3.4 2.6-5.2" />
          <path d="M3.4 18.7l17.2-3.5" />
          <path d="M3.4 15.2l17.2 3.5" />
        </g>
        <circle cx="12" cy="12.6" r="1.5" fill="#f59a3c" />
      </svg>
      <span class="boot__name">Project Game Show</span>
      <span class="boot__dots" aria-hidden="true">
        <span class="boot__dot"></span><span class="boot__dot"></span><span class="boot__dot"></span>
      </span>
    </div>
  </div>
  <script type="module" src="/src/client/main.jsx"></script>
</body>
</html>
