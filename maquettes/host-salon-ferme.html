<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salon fermé · Project Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   PROJECT GAME SHOW — DESIGN SYSTEM (bloc :root identique partout)
   =================================================================== */
:root{
  /* Fonds */
  --bg-page:#181612; --bg-surface:#29231a; --bg-elevated:#383227;
  /* Textes */
  --text-primary:#f0eeeb; --text-secondary:#cbc7bf; --heading:#7cd591;
  /* Actions */
  --action-primary:#ce6500; --action-primary-hover:#e38328; --action-on-primary:#25170d;
  --action-secondary:#54b66e; --action-secondary-hover:#69c682; --signature:#ffa746;
  /* Statuts */
  --success:#3eab5e; --warning:#efbd24; --danger:#f84c41; --info:#4d9cc7;
  /* Bordures */
  --border:rgba(91,84,73,.55); --border-strong:rgba(91,84,73,.95);
  --border-action:rgba(206,101,0,.8); --border-signature:rgba(255,167,70,.45);
  --border-success:rgba(84,182,110,.5); --border-warning:rgba(239,189,36,.45);
  --border-danger:rgba(248,76,65,.55);
  /* Teintes translucides (14–22 %) */
  --tint-action:rgba(206,101,0,.18); --tint-signature:rgba(255,167,70,.16);
  --tint-success:rgba(84,182,110,.16); --tint-warning:rgba(239,189,36,.14);
  --tint-danger:rgba(248,76,65,.16); --tint-heading:rgba(124,213,145,.14);
  --tint-info:rgba(77,156,199,.16);
  /* Espacements */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --sp-6:32px; --sp-7:48px; --sp-8:64px; --sp-9:96px;
  /* Rayons */
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:9999px;
  /* Tactile */
  --touch-min:44px; --touch-cta:56px;
  /* Motion */
  --dur-fast:140ms; --dur-base:240ms; --dur-slow:320ms; --dur-pop:500ms; --dur-reveal:600ms;
  --ease:cubic-bezier(0.4,0,0.2,1); --ease-out:cubic-bezier(0,0,0.2,1); --ease-pop:cubic-bezier(0.2,0,0,1);
  /* Typographie */
  --ff-display:"Fraunces",Georgia,serif; --ff-text:"Inter",system-ui,sans-serif;
  --fw-reg:400; --fw-med:500; --fw-semi:600; --fw-bold:700; --fw-black:900;
  --lh-title:1.15; --lh-compact:1.3; --lh-body:1.55;
  --fs--1:clamp(0.833rem, 0.807rem + 0.116vw, 0.9rem);
  --fs-0: clamp(1rem, 0.951rem + 0.217vw, 1.125rem);
  --fs-1: clamp(1.2rem, 1.119rem + 0.359vw, 1.406rem);
  --fs-2: clamp(1.44rem, 1.316rem + 0.553vw, 1.758rem);
  --fs-3: clamp(1.728rem, 1.544rem + 0.816vw, 2.197rem);
  --fs-4: clamp(2.074rem, 1.810rem + 1.170vw, 2.747rem);
  --fs-5: clamp(2.488rem, 2.119rem + 1.643vw, 3.433rem);
  --fs-6: clamp(2.986rem, 2.475rem + 2.271vw, 4.292rem);
  --fs-hero: clamp(6.375rem, 4.174rem + 9.783vw, 12rem);
  /* Ombres & lueurs */
  --shadow-card:0 24px 60px rgba(0,0,0,.45); --shadow-pop:0 18px 44px rgba(0,0,0,.55);
  --glow-signature:0 0 28px rgba(255,167,70,.35); --glow-action:0 6px 22px rgba(206,101,0,.32);
  /* Gabarits */
  --maxw-page:1180px; --maxw-accueil:1040px; --maxw-scene:580px; --maxw-card:440px;
}
/* ============================ BASE ============================ */
*,*::before,*::after{box-sizing:border-box}
html,body{background:#181612}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--ff-text);
  font-size:var(--fs-0);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2,h3,h4{font-family:var(--ff-display);line-height:var(--lh-title);margin:0;font-weight:var(--fw-semi)}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:var(--ff-text);font-size:var(--fs-0);color:inherit}
:focus-visible{outline:2px solid var(--action-primary);outline-offset:2px;border-radius:var(--r-sm)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon--sm{width:16px;height:16px}
.icon--lg{width:26px;height:26px}
.eyebrow{font-size:var(--fs--1);font-weight:var(--fw-semi);letter-spacing:.08em;text-transform:uppercase;line-height:var(--lh-compact)}
/* ---------- Boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-2);min-height:var(--touch-min);
  padding:var(--sp-3) var(--sp-5);border:1px solid transparent;border-radius:var(--r-full);background:none;
  font-size:var(--fs-0);font-weight:var(--fw-semi);line-height:var(--lh-compact);cursor:pointer;
  transition:background var(--dur-fast) var(--ease),border-color var(--dur-fast) var(--ease),color var(--dur-fast) var(--ease)}
.btn--primary{background:var(--action-primary);color:var(--action-on-primary);box-shadow:var(--glow-action)}
.btn--primary:hover{background:var(--action-primary-hover)}
.btn--secondary{background:var(--action-secondary);color:var(--action-on-primary)}
.btn--secondary:hover{background:var(--action-secondary-hover)}
.btn--outline{border-color:var(--border-strong);color:var(--text-primary)}
.btn--outline:hover{background:var(--bg-elevated)}
.btn--ghost{color:var(--text-secondary)}
.btn--ghost:hover{background:var(--bg-elevated);color:var(--text-primary)}
.btn--danger{border-color:var(--border-danger);color:var(--danger)}
.btn--danger:hover{background:var(--tint-danger)}
.btn--lg{min-height:var(--touch-cta);font-size:var(--fs-1);padding:var(--sp-4) var(--sp-6)}
.btn--sm{padding:var(--sp-2) var(--sp-4);font-size:var(--fs--1)}
.btn--block{width:100%}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
/* ---------- Cartes ---------- */
.card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:var(--sp-5)}
/* ---------- Animations ---------- */
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.page{animation:fondu var(--dur-fast) var(--ease-out) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .confettis{display:none!important}
}

/* ===================================================================
   PAGE — SALON FERMÉ (écran stable, identique desktop / mobile)
   =================================================================== */
.ferme{min-height:100vh;display:grid;place-items:center;padding:var(--sp-6) var(--sp-4)}
.ferme__carte{width:100%;max-width:var(--maxw-card);text-align:center;padding:var(--sp-6) var(--sp-5);
  box-shadow:var(--shadow-card);animation:pop var(--dur-pop) var(--ease-pop) both}
.ferme__pastille{display:grid;place-items:center;width:64px;height:64px;margin:0 auto var(--sp-5);
  border-radius:var(--r-full);background:var(--action-secondary);color:var(--action-on-primary)}
.ferme__titre{font-size:var(--fs-3);margin-bottom:var(--sp-3)}
.ferme__texte{color:var(--text-secondary);margin-bottom:var(--sp-6)}
.ferme__actions{display:flex;flex-direction:column;gap:var(--sp-3)}
</style>
</head>
<body>
<div class="page">

<main class="ferme">
  <section class="card ferme__carte" aria-labelledby="titre-ferme">
    <span class="ferme__pastille" aria-hidden="true">
      <svg class="icon icon--lg" viewBox="0 0 24 24" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>
    </span>
    <h1 class="ferme__titre" id="titre-ferme">Salon fermé</h1>
    <p class="ferme__texte">Les joueurs ont été déconnectés. Tu restes connecté en tant qu'animateur.</p>

    <div class="ferme__actions">
      <a class="btn btn--primary btn--lg btn--block" href="host-lobby.html">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><polygon points="5 3 19 12 5 21 5 3"/></svg>
        Ouvrir un nouveau salon
      </a>
      <a class="btn btn--secondary btn--block" href="studio.html">
        <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        Gérer mes questionnaires
      </a>
      <a class="btn btn--ghost btn--block" href="host-accueil.html">
        <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Déconnexion
      </a>
    </div>
  </section>
</main>

</div>
</body>
</html>
