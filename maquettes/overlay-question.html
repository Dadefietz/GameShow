<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay OBS — Question · Project Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   PROJECT GAME SHOW — DESIGN SYSTEM (bloc :root identique partout)
   =================================================================== */
:root{
  /* Fonds */
  --bg-page:#181612; --bg-surface:#29231a; --bg-elevated:#383227;
  /* Textes */
  --text-primary:#f0eeeb; --text-secondary:#cbc7bf; --heading:#7cd591;
  /* Actions */
  --action-primary:#ce6500; --action-primary-hover:#e38328; --action-on-primary:#25170d;
  --action-secondary:#54b66e; --action-secondary-hover:#69c682; --signature:#ffa746;
  /* Statuts */
  --success:#3eab5e; --warning:#efbd24; --danger:#f84c41; --info:#4d9cc7;
  /* Bordures */
  --border:rgba(91,84,73,.55); --border-strong:rgba(91,84,73,.95);
  --border-action:rgba(206,101,0,.8); --border-signature:rgba(255,167,70,.45);
  --border-success:rgba(84,182,110,.5); --border-warning:rgba(239,189,36,.45);
  --border-danger:rgba(248,76,65,.55);
  /* Teintes translucides (14–22 %) */
  --tint-action:rgba(206,101,0,.18); --tint-signature:rgba(255,167,70,.16);
  --tint-success:rgba(84,182,110,.16); --tint-warning:rgba(239,189,36,.14);
  --tint-danger:rgba(248,76,65,.16); --tint-heading:rgba(124,213,145,.14);
  --tint-info:rgba(77,156,199,.16);
  /* Fond de plaque overlay (82 % du fond de page) */
  --plaque:rgba(24,22,18,.82);
  /* Espacements */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --sp-6:32px; --sp-7:48px; --sp-8:64px; --sp-9:96px;
  /* Rayons */
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:9999px;
  /* Tactile */
  --touch-min:44px; --touch-cta:56px;
  /* Motion */
  --dur-fast:140ms; --dur-base:240ms; --dur-slow:320ms; --dur-pop:500ms; --dur-reveal:600ms;
  --ease:cubic-bezier(0.4,0,0.2,1); --ease-out:cubic-bezier(0,0,0.2,1); --ease-pop:cubic-bezier(0.2,0,0,1);
  /* Typographie */
  --ff-display:"Fraunces",Georgia,serif; --ff-text:"Inter",system-ui,sans-serif;
  --fw-reg:400; --fw-med:500; --fw-semi:600; --fw-bold:700; --fw-black:900;
  --lh-title:1.15; --lh-compact:1.3; --lh-body:1.55;
  --fs--1:clamp(0.833rem, 0.807rem + 0.116vw, 0.9rem);
  --fs-0: clamp(1rem, 0.951rem + 0.217vw, 1.125rem);
  --fs-1: clamp(1.2rem, 1.119rem + 0.359vw, 1.406rem);
  --fs-2: clamp(1.44rem, 1.316rem + 0.553vw, 1.758rem);
  --fs-3: clamp(1.728rem, 1.544rem + 0.816vw, 2.197rem);
  --fs-4: clamp(2.074rem, 1.810rem + 1.170vw, 2.747rem);
  --fs-5: clamp(2.488rem, 2.119rem + 1.643vw, 3.433rem);
  --fs-6: clamp(2.986rem, 2.475rem + 2.271vw, 4.292rem);
  --fs-hero: clamp(6.375rem, 4.174rem + 9.783vw, 12rem);
  /* Ombres & lueurs */
  --shadow-card:0 24px 60px rgba(0,0,0,.45); --shadow-pop:0 18px 44px rgba(0,0,0,.55);
  --glow-signature:0 0 28px rgba(255,167,70,.35); --glow-action:0 6px 22px rgba(206,101,0,.32);
  /* Gabarits */
  --maxw-page:1180px; --maxw-accueil:1040px; --maxw-scene:580px; --maxw-card:440px;
  /* Canvas OBS */
  --canvas-l:1920px; --canvas-h:1080px;
}
/* ============================ BASE ============================ */
*,*::before,*::after{box-sizing:border-box}
/* FOND RÉELLEMENT TRANSPARENT — c'est un overlay OBS */
html,body{background:transparent}
body{margin:0;color:var(--text-primary);font-family:var(--ff-text);font-size:var(--fs-0);
  line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2{font-family:var(--ff-display);line-height:var(--lh-title);margin:0;font-weight:var(--fw-semi)}
p{margin:0}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.eyebrow{font-size:var(--fs--1);font-weight:var(--fw-semi);letter-spacing:.08em;text-transform:uppercase;line-height:var(--lh-compact)}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
}

/* ===================================================================
   AIDE À LA PRÉVISUALISATION — supprime la classe « demo-bg »
   sur <body> pour retrouver le fond transparent d'origine.
   =================================================================== */
.demo-bg{display:grid;place-items:center;min-height:100vh;
  background-color:var(--bg-elevated);
  background-image:
    linear-gradient(45deg, rgba(0,0,0,.35) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.35) 75%),
    linear-gradient(45deg, rgba(0,0,0,.35) 25%, transparent 25%, transparent 75%, rgba(0,0,0,.35) 75%);
  background-size:48px 48px;background-position:0 0, 24px 24px}
.demo-bg .canvas{transform-origin:center}
@media (max-width:1900px){.demo-bg .canvas{transform:scale(.66)}}
@media (max-width:1260px){.demo-bg .canvas{transform:scale(.5)}}
@media (max-width:960px){.demo-bg .canvas{transform:scale(.34)}}

/* ===================================================================
   CANVAS OBS — 1920 × 1080, fond transparent
   =================================================================== */
.canvas{position:relative;width:var(--canvas-l);height:var(--canvas-h);flex:none}

.plaque{position:absolute;left:var(--sp-8);right:var(--sp-8);bottom:var(--sp-8);
  display:flex;align-items:flex-end;justify-content:space-between;gap:var(--sp-8);
  padding:var(--sp-7);border:1px solid var(--border-strong);border-radius:var(--r-xl);
  background:var(--plaque);backdrop-filter:blur(14px);box-shadow:var(--shadow-card);
  animation:pop var(--dur-pop) var(--ease-pop) both}
.plaque__corps{flex:1;min-width:0}
.plaque__tags{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.tag{display:inline-flex;align-items:center;gap:var(--sp-2);padding:var(--sp-2) var(--sp-5);
  border-radius:var(--r-full);font-size:var(--fs-1);font-weight:var(--fw-bold);letter-spacing:.08em;
  text-transform:uppercase}
.tag--module{background:var(--tint-action);border:1px solid var(--border-signature);color:var(--signature)}
.tag--epreuve{background:var(--bg-elevated);border:1px solid var(--border);color:var(--text-secondary)}
.plaque__question{font-size:var(--fs-6);font-weight:var(--fw-black);line-height:var(--lh-title)}
.reponse-bandeau{display:inline-flex;align-items:center;gap:var(--sp-4);margin-top:var(--sp-5);
  padding:var(--sp-4) var(--sp-6);border-radius:var(--r-lg);
  background:var(--tint-success);border:1px solid var(--border-success);
  animation:pop var(--dur-pop) var(--ease-pop) both}
.reponse-bandeau__pastille{display:grid;place-items:center;width:56px;height:56px;flex:none;
  border-radius:var(--r-full);background:var(--action-secondary);color:var(--action-on-primary)}
.reponse-bandeau__pastille .icon{width:32px;height:32px}
.reponse-bandeau__label{display:block;color:var(--heading);font-size:var(--fs-0)}
.reponse-bandeau__valeur{display:block;font-family:var(--ff-display);font-size:var(--fs-4);font-weight:var(--fw-black)}

.stats{display:flex;flex-direction:column;gap:var(--sp-4);flex:none;width:300px}
.stat{padding:var(--sp-5);text-align:center;border-radius:var(--r-lg);
  background:var(--bg-elevated);border:1px solid var(--border)}
.stat__valeur{display:block;font-family:var(--ff-display);font-size:var(--fs-5);font-weight:var(--fw-black);
  color:var(--signature);line-height:var(--lh-title)}
.stat__label{display:flex;align-items:center;justify-content:center;gap:var(--sp-2);
  color:var(--text-secondary);font-size:var(--fs-1)}
</style>
</head>
<!-- Retire la classe « demo-bg » pour obtenir le rendu OBS (fond transparent). -->
<body class="demo-bg">

<main class="canvas">

  <section class="plaque" aria-labelledby="question-overlay">
    <div class="plaque__corps">
      <div class="plaque__tags">
        <p class="tag tag--module"><span aria-hidden="true">✦</span> Quiz</p>
        <p class="tag tag--epreuve">Épreuve 2</p>
      </div>

      <h1 class="plaque__question" id="question-overlay">Quel est le plus grand océan ?</h1>

      <p class="reponse-bandeau">
        <span class="reponse-bandeau__pastille" aria-hidden="true">
          <svg class="icon" viewBox="0 0 24 24" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span>
          <span class="eyebrow reponse-bandeau__label">Bonne réponse</span>
          <span class="reponse-bandeau__valeur">Pacifique</span>
        </span>
      </p>
    </div>

    <div class="stats">
      <p class="stat">
        <span class="stat__valeur">128</span>
        <span class="stat__label">réponses</span>
      </p>
      <p class="stat">
        <span class="stat__valeur">18 s</span>
        <span class="stat__label">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          temps restant
        </span>
      </p>
    </div>
  </section>

</main>

</body>
</html>
