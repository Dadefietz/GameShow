<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question — Quiz · Project Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   PROJECT GAME SHOW — DESIGN SYSTEM (bloc :root identique partout)
   =================================================================== */
:root{
  /* Fonds */
  --bg-page:#181612; --bg-surface:#29231a; --bg-elevated:#383227;
  /* Textes */
  --text-primary:#f0eeeb; --text-secondary:#cbc7bf; --heading:#7cd591;
  /* Actions */
  --action-primary:#ce6500; --action-primary-hover:#e38328; --action-on-primary:#25170d;
  --action-secondary:#54b66e; --action-secondary-hover:#69c682; --signature:#ffa746;
  /* Statuts */
  --success:#3eab5e; --warning:#efbd24; --danger:#f84c41; --info:#4d9cc7;
  /* Bordures */
  --border:rgba(91,84,73,.55); --border-strong:rgba(91,84,73,.95);
  --border-action:rgba(206,101,0,.8); --border-signature:rgba(255,167,70,.45);
  --border-success:rgba(84,182,110,.5); --border-warning:rgba(239,189,36,.45);
  --border-danger:rgba(248,76,65,.55);
  /* Teintes translucides (14–22 %) */
  --tint-action:rgba(206,101,0,.18); --tint-signature:rgba(255,167,70,.16);
  --tint-success:rgba(84,182,110,.16); --tint-warning:rgba(239,189,36,.14);
  --tint-danger:rgba(248,76,65,.16); --tint-heading:rgba(124,213,145,.14);
  --tint-info:rgba(77,156,199,.16);
  /* Espacements */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --sp-6:32px; --sp-7:48px; --sp-8:64px; --sp-9:96px;
  /* Rayons */
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:9999px;
  /* Tactile */
  --touch-min:44px; --touch-cta:56px;
  /* Motion */
  --dur-fast:140ms; --dur-base:240ms; --dur-slow:320ms; --dur-pop:500ms; --dur-reveal:600ms;
  --ease:cubic-bezier(0.4,0,0.2,1); --ease-out:cubic-bezier(0,0,0.2,1); --ease-pop:cubic-bezier(0.2,0,0,1);
  /* Typographie */
  --ff-display:"Fraunces",Georgia,serif; --ff-text:"Inter",system-ui,sans-serif;
  --fw-reg:400; --fw-med:500; --fw-semi:600; --fw-bold:700; --fw-black:900;
  --lh-title:1.15; --lh-compact:1.3; --lh-body:1.55;
  --fs--1:clamp(0.833rem, 0.807rem + 0.116vw, 0.9rem);
  --fs-0: clamp(1rem, 0.951rem + 0.217vw, 1.125rem);
  --fs-1: clamp(1.2rem, 1.119rem + 0.359vw, 1.406rem);
  --fs-2: clamp(1.44rem, 1.316rem + 0.553vw, 1.758rem);
  --fs-3: clamp(1.728rem, 1.544rem + 0.816vw, 2.197rem);
  --fs-4: clamp(2.074rem, 1.810rem + 1.170vw, 2.747rem);
  --fs-5: clamp(2.488rem, 2.119rem + 1.643vw, 3.433rem);
  --fs-6: clamp(2.986rem, 2.475rem + 2.271vw, 4.292rem);
  --fs-hero: clamp(6.375rem, 4.174rem + 9.783vw, 12rem);
  /* Ombres & lueurs */
  --shadow-card:0 24px 60px rgba(0,0,0,.45); --shadow-pop:0 18px 44px rgba(0,0,0,.55);
  --glow-signature:0 0 28px rgba(255,167,70,.35); --glow-action:0 6px 22px rgba(206,101,0,.32);
  /* Gabarits */
  --maxw-page:1180px; --maxw-accueil:1040px; --maxw-scene:580px; --maxw-card:440px;
}
/* ============================ BASE ============================ */
*,*::before,*::after{box-sizing:border-box}
html,body{background:#181612}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--ff-text);
  font-size:var(--fs-0);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2,h3,h4{font-family:var(--ff-display);line-height:var(--lh-title);margin:0;font-weight:var(--fw-semi)}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font-family:var(--ff-text);font-size:var(--fs-0);color:inherit}
:focus-visible{outline:2px solid var(--action-primary);outline-offset:2px;border-radius:var(--r-sm)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon--sm{width:16px;height:16px}
.eyebrow{font-size:var(--fs--1);font-weight:var(--fw-semi);letter-spacing:.08em;text-transform:uppercase;line-height:var(--lh-compact)}
/* ---------- Animations ---------- */
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.page{animation:fondu var(--dur-fast) var(--ease-out) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .confettis{display:none!important}
}
/* ---------- Scène joueur ---------- */
.scene{min-height:100vh;display:flex;flex-direction:column;padding:var(--sp-5) var(--sp-4) var(--sp-7)}
.scene__carte{width:100%;flex:1;display:flex;flex-direction:column}

/* ===================================================================
   GABARIT — QUESTION JOUEUR
   =================================================================== */
.q-entete{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-5)}
.q-badge{display:inline-flex;align-items:center;min-height:36px;padding:var(--sp-2) var(--sp-4);
  border-radius:var(--r-full);background:var(--tint-success);border:1px solid var(--border-success);
  color:var(--heading);font-size:var(--fs--1);font-weight:var(--fw-semi)}
.q-score{display:inline-flex;align-items:center;gap:var(--sp-2);min-height:36px;padding:var(--sp-2) var(--sp-4);
  border-radius:var(--r-full);background:var(--tint-action);border:1px solid var(--border-signature);
  color:var(--signature);font-size:var(--fs--1);font-weight:var(--fw-semi)}
.chrono{text-align:center;margin-bottom:var(--sp-3)}
.chrono__valeur{font-family:var(--ff-display);font-size:var(--fs-6);font-weight:var(--fw-black);
  color:var(--signature);line-height:var(--lh-title)}
.jauge{height:8px;border-radius:var(--r-full);background:var(--bg-elevated);overflow:hidden;margin-bottom:var(--sp-6)}
.jauge__barre{display:block;height:100%;border-radius:var(--r-full);
  background:linear-gradient(90deg,var(--action-primary),var(--signature));
  transition:width 1s linear}
.jauge__barre[data-urgent="oui"]{background:var(--danger)}
.q-texte{font-size:var(--fs-3);font-weight:var(--fw-bold);margin-bottom:var(--sp-6)}
.reponses{display:flex;flex-direction:column;gap:var(--sp-3)}
.reponse{display:flex;align-items:center;gap:var(--sp-4);width:100%;min-height:var(--touch-cta);
  padding:var(--sp-3) var(--sp-4);text-align:left;cursor:pointer;
  background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-md);
  font-size:var(--fs-0);font-weight:var(--fw-med);
  transition:border-color var(--dur-fast) var(--ease),background var(--dur-fast) var(--ease),opacity var(--dur-base) var(--ease)}
.reponse:hover{border-color:var(--border-strong)}
.reponse__lettre{display:grid;place-items:center;width:36px;height:36px;flex:none;border-radius:var(--r-full);
  background:var(--tint-action);border:1px solid var(--border-signature);color:var(--signature);
  font-family:var(--ff-display);font-weight:var(--fw-bold);font-size:var(--fs--1)}
.reponse__libelle{flex:1;min-width:0}
.reponse__badge{display:none;flex:none;padding:var(--sp-1) var(--sp-3);border-radius:var(--r-full);
  background:var(--action-secondary);color:var(--action-on-primary);
  font-size:var(--fs--1);font-weight:var(--fw-bold);letter-spacing:.08em}
.reponse--choisie{border-color:var(--border-success);background:var(--tint-success);cursor:default}
.reponse--choisie .reponse__lettre{background:var(--action-secondary);border-color:var(--border-success);
  color:var(--action-on-primary)}
.reponse--choisie .reponse__badge{display:inline-block}
.reponse--estompee{opacity:.38;cursor:default}
.q-etat{margin-top:var(--sp-5);text-align:center;color:var(--heading);font-size:var(--fs--1);font-weight:var(--fw-semi)}

@media (min-width:900px){
  body{background-image:
    radial-gradient(60% 50% at 50% 0%, var(--tint-action), transparent 70%),
    radial-gradient(50% 40% at 50% 100%, var(--tint-signature), transparent 70%)}
  .scene{align-items:center;justify-content:center;padding:var(--sp-8) var(--sp-6)}
  .scene__carte{flex:none;max-width:var(--maxw-scene);padding:var(--sp-7);
    background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-xl);
    box-shadow:var(--shadow-card)}
  .reponses{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-4)}
  .reponse{min-height:64px}
}
</style>
</head>
<body>
<div class="page">

<main class="scene">
  <div class="scene__carte">

    <div class="q-entete">
      <p class="q-badge">Question 2</p>
      <p class="q-score">
        <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        967
      </p>
    </div>

    <p class="chrono" role="timer" aria-live="off">
      <span class="chrono__valeur" id="chrono">13 s</span>
    </p>
    <div class="jauge"><span class="jauge__barre" id="jauge" style="width:65%"></span></div>

    <h1 class="q-texte">Quel est le plus grand océan ?</h1>

    <div class="reponses" data-repondu="oui" role="group" aria-label="Réponses possibles">
      <button class="reponse reponse--estompee" type="button" disabled>
        <span class="reponse__lettre" aria-hidden="true">A</span>
        <span class="reponse__libelle">Atlantique</span>
      </button>
      <button class="reponse reponse--estompee" type="button" disabled>
        <span class="reponse__lettre" aria-hidden="true">B</span>
        <span class="reponse__libelle">Indien</span>
      </button>
      <button class="reponse reponse--choisie" type="button" disabled aria-pressed="true">
        <span class="reponse__lettre" aria-hidden="true">
          <svg class="icon icon--sm" viewBox="0 0 24 24" stroke-width="2.6"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span class="reponse__libelle">Pacifique</span>
        <span class="reponse__badge">Envoyé</span>
      </button>
      <button class="reponse reponse--estompee" type="button" disabled>
        <span class="reponse__lettre" aria-hidden="true">D</span>
        <span class="reponse__libelle">Arctique</span>
      </button>
    </div>

    <p class="q-etat" role="status">Réponse envoyée</p>

  </div>
</main>

</div>

<script>
/* Démo : chrono + barre de progression du temps (rouge sous 5 s) */
(function () {
  var chrono = document.getElementById('chrono');
  var jauge = document.getElementById('jauge');
  var total = 20;
  var restant = 13;
  var battement = setInterval(function () {
    restant -= 1;
    if (restant <= 0) { restant = 0; clearInterval(battement); }
    chrono.textContent = restant + ' s';
    jauge.style.width = (restant / total * 100) + '%';
    if (restant < 5) { jauge.setAttribute('data-urgent', 'oui'); }
  }, 1000);
})();
</script>
</body>
</html>
