<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raté… · Project Game Show</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===================================================================
   PROJECT GAME SHOW — DESIGN SYSTEM (bloc :root identique partout)
   =================================================================== */
:root{
  /* Fonds */
  --bg-page:#181612; --bg-surface:#29231a; --bg-elevated:#383227;
  /* Textes */
  --text-primary:#f0eeeb; --text-secondary:#cbc7bf; --heading:#7cd591;
  /* Actions */
  --action-primary:#ce6500; --action-primary-hover:#e38328; --action-on-primary:#25170d;
  --action-secondary:#54b66e; --action-secondary-hover:#69c682; --signature:#ffa746;
  /* Statuts */
  --success:#3eab5e; --warning:#efbd24; --danger:#f84c41; --info:#4d9cc7;
  /* Bordures */
  --border:rgba(91,84,73,.55); --border-strong:rgba(91,84,73,.95);
  --border-action:rgba(206,101,0,.8); --border-signature:rgba(255,167,70,.45);
  --border-success:rgba(84,182,110,.5); --border-warning:rgba(239,189,36,.45);
  --border-danger:rgba(248,76,65,.55);
  /* Teintes translucides (14–22 %) */
  --tint-action:rgba(206,101,0,.18); --tint-signature:rgba(255,167,70,.16);
  --tint-success:rgba(84,182,110,.16); --tint-warning:rgba(239,189,36,.14);
  --tint-danger:rgba(248,76,65,.16); --tint-heading:rgba(124,213,145,.14);
  --tint-info:rgba(77,156,199,.16);
  /* Espacements */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --sp-6:32px; --sp-7:48px; --sp-8:64px; --sp-9:96px;
  /* Rayons */
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:28px; --r-full:9999px;
  /* Tactile */
  --touch-min:44px; --touch-cta:56px;
  /* Motion */
  --dur-fast:140ms; --dur-base:240ms; --dur-slow:320ms; --dur-pop:500ms; --dur-reveal:600ms;
  --ease:cubic-bezier(0.4,0,0.2,1); --ease-out:cubic-bezier(0,0,0.2,1); --ease-pop:cubic-bezier(0.2,0,0,1);
  /* Typographie */
  --ff-display:"Fraunces",Georgia,serif; --ff-text:"Inter",system-ui,sans-serif;
  --fw-reg:400; --fw-med:500; --fw-semi:600; --fw-bold:700; --fw-black:900;
  --lh-title:1.15; --lh-compact:1.3; --lh-body:1.55;
  --fs--1:clamp(0.833rem, 0.807rem + 0.116vw, 0.9rem);
  --fs-0: clamp(1rem, 0.951rem + 0.217vw, 1.125rem);
  --fs-1: clamp(1.2rem, 1.119rem + 0.359vw, 1.406rem);
  --fs-2: clamp(1.44rem, 1.316rem + 0.553vw, 1.758rem);
  --fs-3: clamp(1.728rem, 1.544rem + 0.816vw, 2.197rem);
  --fs-4: clamp(2.074rem, 1.810rem + 1.170vw, 2.747rem);
  --fs-5: clamp(2.488rem, 2.119rem + 1.643vw, 3.433rem);
  --fs-6: clamp(2.986rem, 2.475rem + 2.271vw, 4.292rem);
  --fs-hero: clamp(6.375rem, 4.174rem + 9.783vw, 12rem);
  /* Ombres & lueurs */
  --shadow-card:0 24px 60px rgba(0,0,0,.45); --shadow-pop:0 18px 44px rgba(0,0,0,.55);
  --glow-signature:0 0 28px rgba(255,167,70,.35); --glow-action:0 6px 22px rgba(206,101,0,.32);
  /* Gabarits */
  --maxw-page:1180px; --maxw-accueil:1040px; --maxw-scene:580px; --maxw-card:440px;
}
/* ============================ BASE ============================ */
*,*::before,*::after{box-sizing:border-box}
html,body{background:#181612}
body{margin:0;background:var(--bg-page);color:var(--text-primary);font-family:var(--ff-text);
  font-size:var(--fs-0);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2,h3,h4{font-family:var(--ff-display);line-height:var(--lh-title);margin:0;font-weight:var(--fw-semi)}
p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
a{color:inherit;text-decoration:none}
button,input{font-family:var(--ff-text);font-size:var(--fs-0);color:inherit}
:focus-visible{outline:2px solid var(--action-primary);outline-offset:2px;border-radius:var(--r-sm)}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.icon{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon--sm{width:16px;height:16px}
.icon--lg{width:26px;height:26px}
.eyebrow{font-size:var(--fs--1);font-weight:var(--fw-semi);letter-spacing:.08em;text-transform:uppercase;line-height:var(--lh-compact)}
/* ---------- Animations ---------- */
@keyframes fondu{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.92) translateY(10px)}to{opacity:1;transform:none}}
.page{animation:fondu var(--dur-fast) var(--ease-out) both}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-iteration-count:1!important;transition-duration:1ms!important}
  .confettis{display:none!important}
}
/* ---------- Scène joueur ---------- */
.scene{min-height:100vh;display:flex;flex-direction:column;padding:var(--sp-6) var(--sp-4) var(--sp-7)}
.scene__carte{width:100%;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}

/* ===================================================================
   PAGE — JOUEUR : RATÉ (aucun confetti)
   =================================================================== */
.verdict__pastille{display:grid;place-items:center;width:72px;height:72px;margin-bottom:var(--sp-4);
  border-radius:var(--r-full);background:var(--danger);color:var(--action-on-primary);
  animation:pop var(--dur-pop) var(--ease-pop) both}
.verdict__titre{font-size:var(--fs-2);font-weight:var(--fw-bold);color:var(--text-primary);margin-bottom:var(--sp-4)}
.gain{display:inline-flex;align-items:center;min-height:var(--touch-min);padding:var(--sp-2) var(--sp-6);
  margin-bottom:var(--sp-5);border-radius:var(--r-full);background:var(--bg-elevated);
  border:1px solid var(--border);color:var(--text-secondary);
  font-family:var(--ff-display);font-size:var(--fs-1);font-weight:var(--fw-bold)}
.bonne-reponse{display:flex;align-items:center;gap:var(--sp-3);width:100%;max-width:var(--maxw-card);
  text-align:left;margin-bottom:var(--sp-6);padding:var(--sp-4);
  background:var(--tint-success);border:1px solid var(--border-success);border-radius:var(--r-md);
  animation:pop var(--dur-pop) var(--ease-pop) both}
.bonne-reponse__icone{color:var(--heading)}
.bonne-reponse__texte{font-size:var(--fs--1);color:var(--text-secondary)}
.bonne-reponse__valeur{color:var(--text-primary);font-weight:var(--fw-semi)}
.rang-final{margin-bottom:var(--sp-6)}
.rang-final__label{display:block;color:var(--text-secondary);margin-bottom:var(--sp-2)}
.rang-final__valeur{display:block;font-family:var(--ff-display);font-size:var(--fs-hero);font-weight:var(--fw-black);
  color:var(--signature);line-height:var(--lh-title);text-shadow:var(--glow-signature)}
.rang-final__total{display:block;color:var(--text-secondary);font-size:var(--fs--1)}
.mini{width:100%;max-width:var(--maxw-card);text-align:left;margin-bottom:var(--sp-6)}
.mini__titre{color:var(--text-secondary);margin-bottom:var(--sp-3)}
.mini__liste{display:flex;flex-direction:column;gap:var(--sp-2)}
.rang{display:grid;grid-template-columns:26px 1fr auto;gap:var(--sp-3);align-items:center;
  padding:var(--sp-3) var(--sp-4);background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--r-md)}
.rang--toi{border-color:var(--border-action);background:var(--tint-action)}
.rang__num{font-family:var(--ff-display);font-weight:var(--fw-bold);color:var(--text-secondary);font-size:var(--fs--1)}
.rang--toi .rang__num{color:var(--signature)}
.rang__pseudo{display:flex;align-items:center;gap:var(--sp-2);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;font-weight:var(--fw-med)}
.rang__trophee{color:var(--signature)}
.rang__score{font-family:var(--ff-display);font-weight:var(--fw-bold);font-size:var(--fs--1)}
.rang--toi .rang__score{color:var(--signature)}
.suite{display:inline-flex;align-items:center;gap:var(--sp-2);color:var(--text-secondary);font-size:var(--fs--1)}

@media (min-width:900px){
  body{background-image:
    radial-gradient(60% 50% at 50% 0%, var(--tint-action), transparent 70%),
    radial-gradient(50% 40% at 50% 100%, var(--tint-signature), transparent 70%)}
  .scene{align-items:center;justify-content:center;padding:var(--sp-8) var(--sp-6)}
  .scene__carte{flex:none;max-width:var(--maxw-scene);padding:var(--sp-7);
    background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--r-xl);
    box-shadow:var(--shadow-card)}
}
</style>
</head>
<body>
<div class="page">

<main class="scene">
  <div class="scene__carte">

    <span class="verdict__pastille" aria-hidden="true">
      <svg class="icon icon--lg" viewBox="0 0 24 24" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </span>
    <h1 class="verdict__titre">Raté…</h1>

    <p class="gain" role="status">+0 point</p>

    <p class="bonne-reponse">
      <span class="bonne-reponse__icone" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" stroke-width="2.2"><polyline points="20 6 9 17 4 12"/></svg>
      </span>
      <span class="bonne-reponse__texte">La bonne réponse : <span class="bonne-reponse__valeur">Pacifique</span></span>
    </p>

    <p class="rang-final">
      <span class="eyebrow rang-final__label">Ton rang</span>
      <span class="rang-final__valeur">3ᵉ</span>
      <span class="rang-final__total">640 pts au total</span>
    </p>

    <section class="mini" aria-labelledby="titre-mini">
      <h2 class="eyebrow mini__titre" id="titre-mini">Classement</h2>
      <ol class="mini__liste">
        <li class="rang">
          <span class="rang__num">1</span>
          <span class="rang__pseudo" title="Luna">
            <svg class="icon icon--sm rang__trophee" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>
            Luna
          </span>
          <span class="rang__score">910</span>
        </li>
        <li class="rang"><span class="rang__num">2</span><span class="rang__pseudo" title="Marco">Marco</span><span class="rang__score">840</span></li>
        <li class="rang rang--toi"><span class="rang__num">3</span><span class="rang__pseudo" title="Toi">Toi</span><span class="rang__score">640</span></li>
      </ol>
    </section>

    <p class="suite" role="status">
      <svg class="icon icon--sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      Prochaine épreuve…
    </p>

  </div>
</main>

</div>
</body>
</html>
