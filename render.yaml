# Render Blueprint — déploiement 1-service du serveur de jeu (Node + Socket.IO + front statique).
# Render injecte automatiquement PORT et RENDER_EXTERNAL_URL. GAME_JWT_SECRET est généré à la création.
services:
  - type: web
    name: project-game-show
    runtime: node
    plan: free
    # --include=dev force l'installation des devDependencies (Vite) malgré NODE_ENV=production.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: GAME_JWT_SECRET
        generateValue: true          # secret aléatoire fort, généré et gardé par Render (jamais dans Git)
      - key: MAX_PLAYERS_PER_ROOM
        value: "1000"
      # --- Supabase (auth animateur + questionnaires durables) ---
      # URL et JWKS sont PUBLICS (valeurs en clair). Le service_role est SECRET : à saisir
      # dans le dashboard Render (sync:false), jamais commité.
      - key: SUPABASE_URL
        value: "https://sajdeadrrchahtuxmqxk.supabase.co"
      - key: SUPABASE_JWKS_URL
        value: "https://sajdeadrrchahtuxmqxk.supabase.co/auth/v1/.well-known/jwks.json"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # --- Animateur unique (R1, SECURITY-AUDIT) : pour verrouiller la création de salon
      # au seul compte de l'animateur, ajouter dans le dashboard Render (Environment) :
      #   HOST_EMAIL = <email du compte Supabase de l'animateur>
      # Sans cette variable, tout utilisateur authentifié Supabase peut ouvrir un salon.
